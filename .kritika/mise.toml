# Tools for kritika's reviews of this repository; lock with
# `mise -C .kritika lock --platform linux-x64,linux-arm64`.
[tools]
"github:Faustvii/agent-tools" = { version = "v1.1.0", filter_bins = ["konflate"] }

[env]
KONFLATE_URL = "http://konflate-kritika.flux-system.svc.cluster.local:8080"
KONFLATE_HIDE_URL = "true"

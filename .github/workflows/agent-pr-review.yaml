---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: AI PR Review

on:
  pull_request:
    branches: ["main"]
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to (re-)review
        required: true
      force_review:
        description: Re-review even if the diff is unchanged since last pass
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # review-runner, this job feeds untrusted PR text to a tool-calling model,
    # and these runners have less privileges.
    runs-on: review-runner
    # Dense-27B reviews are slow but run in the background with a long
    # deadline. Override the default 360m job cap so a full 27B pass (plus
    # primary retries) is never killed mid-review. Self-hosted runners are
    # not bound by GitHub's 6h hosted-runner limit.
    timeout-minutes: 720
    # Renovate's type/digest PRs do not need model review.
    if: ${{ (github.event_name == 'pull_request' && !github.event.pull_request.draft) || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          # this job checks out untrusted PR code; don't leave a usable token in .git/config
          persist-credentials: false

      - name: Run reviewer
        uses: misospace/pr-reviewer-action@f089f7c41375bef3b0e41c277d65e4d104b5641b # v2.3.0
        with:
          github_token: ${{ github.token }}
          # On workflow_dispatch there is no pull_request context, so the
          # action's auto-detection yields an empty PR_NUMBER and aborts in
          # precheck. Forward the dispatch input; harmless on pull_request
          # (empty -> action falls back to github.event.pull_request.number).
          pr_number: ${{ github.event.inputs.pr_number }}
          # On a manual re-dispatch the diff is usually unchanged since the
          # last pass, so precheck skips (skip_if_diff_unchanged). Honour the
          # dispatch toggle to force it; empty on pull_request -> stays false.
          force_review: ${{ github.event.inputs.force_review }}

          allowed_source_hosts: "github.com,api.github.com,raw.githubusercontent.com,gitlab.com,registry.terraform.io,artifacthub.io,www.talos.dev,talos.dev,fluxcd.io,kubernetes.io,cilium.io"

          ai_base_url: http://modelrouter-router-proxy.ai.svc.cluster.local:8080/v1
          ai_api_key: "in-cluster"
          ai_model: self-qwen3.8
          ai_api_format: openai
          # self-qwen3.8 is a thinking model. The action's SSE reassembler
          # accumulates only delta.content and drops delta.reasoning_content,
          # so a streamed turn yields empty content -> "parse failed" and a
          # silent fallback to self-qwen3.6. Non-streamed returns clean JSON
          # (content separate from reasoning_content), which parses correctly.
          # (The router-proxy's responseHeaderTimeout is raised to match.)
          ai_stream: "false"
          ai_fallback_base_url: http://modelrouter-router-proxy.ai.svc.cluster.local:8080/v1
          ai_fallback_api_key: "in-cluster"
          ai_fallback_model: self-qwen3.6
          ai_fallback_api_format: openai
          ai_max_tokens: "16000"
          ai_primary_retries: "2"
          ai_primary_retry_delay_sec: "5"
          # self-qwen3.8 is a dense 27B (~8.5 tok/s generation, ~70 tok/s
          # prefill on Strix Halo). Timeouts below are sized for it, not
          # the fast MoE fallback. This job runs in the background with a
          # long deadline, so wall-clock is cheap; correctness (letting the
          # 27B finish instead of falling back) is what we want.
          ai_connect_timeout_sec: "30"
          # 16000 output tokens / 8.5 tok/s ~= 1880s, plus prefill. 1h budget.
          ai_request_timeout_sec: "3600"

          system_prompt_file: .agents/instructions/pr-review.instructions.md
          system_prompt_mode: append
          on_model_failure: notice
          inline_findings: "true"
          publish_mode: review_comment
          evidence_providers_file: .github/konflate-evidence-providers.json

          tool_mode: native_loop
          tool_max_requests: "4"
          tool_max_rounds: "2"
          # Overall tool-loop budget across all rounds/requests on the 27B.
          tool_loop_wall_clock_sec: "2400"
          # Each native-loop request emits thinking + a tool call at 8.5 tok/s.
          tool_request_timeout_sec: "600"
          tool_max_response_bytes: "12000"
          # ~30 KB planning corpus = ~115s prefill + up to 8000 planning
          # tokens / 8.5 tok/s (~940s) before the 27B returns a plan.
          tool_planning_timeout_sec: "1200"
          tool_planning_max_context_bytes: "30000"
          tool_planning_max_tokens: "8000"
          tool_allowed_gh_api_repos: "*"
          tool_enable_for_forks: "false"
          tool_mcp_servers: "konflate=http://konflate.flux-system.svc.cluster.local:8080/mcp"

          search_url: http://searxng.ai.svc.cluster.local:8080/search

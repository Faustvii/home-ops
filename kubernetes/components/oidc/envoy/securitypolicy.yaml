---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: ${APP}
spec:
  oidc:
    clientIDRef:
      name: ${APP}-oidc-credentials
    clientSecret:
      name: ${APP}-oidc-credentials
    logoutPath: ${OIDC_PROVIDER_LOGOUT_PATH:=/logout}
    provider:
      issuer: https://idm.${SECRET_DOMAIN}
    redirectURL: https://${APP}.${SECRET_DOMAIN}${OIDC_CALLBACK_PATH:=/oauth2/callback}
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: ${APP}

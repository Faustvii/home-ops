# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: _
spec:
  values:
    service:
      app:
        annotations:
          com.dashbrr.service.type: "${APP,,}"
          com.dashbrr.service.url: "http://${APP}.${NAMESPACE}.svc.cluster.local"
          com.dashbrr.service.access_url: "https://${APP}.${SECRET_DOMAIN}" # Does not work yet.. maybe support will come?
          com.dashbrr.service.apikey: "$${${APP^^}_${DASHBRR_API_KEY:=API_KEY}}"
          com.dashbrr.service.enabled: "true"

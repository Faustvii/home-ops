---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: ${APP}-postgres
spec:
  instances: 2

  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:c7747d8d1049fff9cf30d9cd83d14d609c957afb5ffbcd114145f393ea1850e1

  primaryUpdateStrategy: unsupervised
  # Switchover rejects an update that changes image and parameters at once;
  # apply them one at a time.
  primaryUpdateMethod: switchover

  postgresql:
    # A commit waits for the standby while it is healthy; with the standby
    # down, writes go on without it.
    synchronous:
      method: any
      number: 1
      dataDurability: preferred

  storage:
    size: ${STORAGE}

  bootstrap:
    initdb:
      database: ${APP}
      owner: ${OWNER}
      secret:
        name: ${APP}-postgres

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: ${APP}-postgres
        # Bump DATABASE_GENERATION on every rebuild: a fresh initdb refuses a
        # WAL archive that already holds another timeline under the same name.
        serverName: ${APP}-postgres-${GENERATION}

  monitoring:
    enablePodMonitor: true

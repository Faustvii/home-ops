---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# The app's database on its own "${APP}-postgres" cluster in the app's
# namespace, with its own bucket and backups. The app's ks.yaml must set
# NAMESPACE (namespace: *namespace) and can tune:
# DATABASE_STORAGE (5Gi), DATABASE_BUCKET_SIZE (20Gi) and
# DATABASE_GENERATION (v1; bump to v2 etc. after a rebuild, see cluster/cluster.yaml).
# For more (extensions, extra roles), point DATABASE_CLUSTER_PATH and/or
# DATABASE_DB_PATH at an overlay of standalone/cluster or base/db.
components:
  - ../base
resources:
  - ./externalsecret.yaml
  - ./ks.yaml
patches:
  # The base db Kustomization uses the shared cluster. This patch moves it to
  # the app's cluster and namespace. It also waits for that cluster.
  - patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: ${APP}-db
        namespace: database
      spec:
        dependsOn:
          - name: cnpg
            namespace: database
          - name: ${APP}-postgres
            namespace: ${NAMESPACE}
        healthChecks:
          - apiVersion: postgresql.cnpg.io/v1
            kind: Database
            name: postgres-${APP}
            namespace: ${NAMESPACE}
        targetNamespace: ${NAMESPACE}
        postBuild:
          substitute:
            CLUSTER: ${APP}-postgres
  - patch: |-
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: _
      spec:
        values:
          defaultPodOptions:
            annotations:
              k8s.ksgate.org/postgres-ready: |
                {
                  "apiVersion": "postgresql.cnpg.io/v1",
                  "kind": "Cluster",
                  "name": "${APP}-postgres",
                  "namespace": "${NAMESPACE}",
                  "expression": "resource.status.readyInstances >= 1"
                }
              k8s.ksgate.org/postgres-service: |
                {
                  "apiVersion": "v1",
                  "kind": "Service",
                  "name": "${APP}-postgres-rw",
                  "namespace": "${NAMESPACE}"
                }
              k8s.ksgate.org/database-applied: |
                {
                  "apiVersion": "postgresql.cnpg.io/v1",
                  "kind": "Database",
                  "name": "postgres-${APP}",
                  "namespace": "${NAMESPACE}",
                  "expression": "resource.status.applied"
                }
            schedulingGates:
              - name: k8s.ksgate.org/postgres-ready
              - name: k8s.ksgate.org/postgres-service
              - name: k8s.ksgate.org/database-applied
    target:
      group: helm.toolkit.fluxcd.io
      kind: HelmRelease
      version: v2

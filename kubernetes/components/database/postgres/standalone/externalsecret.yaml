---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name ${APP}-postgres
spec:
  refreshInterval: "0"
  target:
    name: *name
    template:
      type: kubernetes.io/basic-auth
      data:
        connectionString: "Host=${APP}-postgres-rw.${NAMESPACE}.svc.cluster.local;Port=5432;Database=${APP};Username=${DATABASE_OWNER:=${APP}};Password={{ .password }}"
        database: "${APP}"
        host: "${APP}-postgres-rw.${NAMESPACE}.svc.cluster.local"
        password: "{{ .password }}"
        uri: "postgresql://${DATABASE_OWNER:=${APP}}:{{ .password }}@${APP}-postgres-rw.${NAMESPACE}.svc.cluster.local:5432/${APP}"
        username: "${DATABASE_OWNER:=${APP}}"
      engineVersion: v2
      metadata:
        labels:
          cnpg.io/reload: "true"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: pw

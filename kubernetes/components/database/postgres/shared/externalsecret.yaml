---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name ${APP}-postgres
spec:
  refreshInterval: "0"
  target:
    name: *name
    template:
      data:
        connectionString: "Host=postgres-rw.database.svc.cluster.local;Port=5432;Database=${APP};Username=${DATABASE_OWNER:=${APP}};Password={{ .password }}"
        database: "${APP}"
        host: "postgres-rw.database.svc.cluster.local"
        password: "{{ .password }}"
        uri: "postgresql://${DATABASE_OWNER:=${APP}}:{{ .password }}@postgres-rw.database.svc.cluster.local:5432/${APP}"
        username: "${DATABASE_OWNER:=${APP}}"
      engineVersion: v2
      metadata:
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "database"
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
        labels:
          cnpg.io/reload: "true"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: pw

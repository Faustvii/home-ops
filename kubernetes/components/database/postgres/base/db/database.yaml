---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/database_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: postgres-${APP}
  namespace: database
spec:
  cluster:
    name: ${CLUSTER}
  databaseReclaimPolicy: ${RECLAIM_POLICY:=delete}
  name: ${APP}
  owner: ${OWNER}

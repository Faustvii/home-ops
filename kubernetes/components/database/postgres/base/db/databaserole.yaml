---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/databaserole_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: postgres-${OWNER}
  namespace: database
spec:
  cluster:
    name: postgres
  comment: "${APP} user"
  databaseRoleReclaimPolicy: delete
  login: true
  name: ${OWNER}
  passwordSecret:
    name: ${APP}-postgres
  superuser: false

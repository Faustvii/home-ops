---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wyoming-piper
  namespace: home
spec:
  chartRef:
    kind: OCIRepository
    name: wyoming-piper
  interval: 1h
  dependsOn: []

  values:
    controllers:
      wyoming-piper:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          enableServiceLinks: false
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
        containers:
          app:
            image:
              repository: rhasspy/wyoming-piper
              tag: 2.4.3@sha256:f7aaafe325d18979f43a9fe8bb4db494ba28ce8c109cb982983157817705ff87
            args:
              - --voice=en-gb-southern_english_female-low
            resources:
              requests:
                cpu: 100m
                memory: 128M
              limits:
                memory: 512M
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
    service:
      app:
        type: LoadBalancer
        annotations:
          external-dns.alpha.kubernetes.io/hostname: piper.${SECRET_DOMAIN}
          lbipam.cilium.io/ips: 192.168.10.41
        controller: wyoming-piper
        ports:
          http:
            port: 10200

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app wyoming-whisper
  namespace: home
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  dependsOn: []

  values:
    controllers:
      wyoming-whisper:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: rhasspy/wyoming-whisper
              tag: 3.8.1@sha256:ba6fcb6056ebe237d15a325381763a80af2fc8fcedaa04f6a714a7375eb20d80
            args:
              - --model
              - base
              - --language
              - en
            env:
              WYOMING_WHISPER__INSTANCE_NAME: Wyoming-Whisper
              WYOMING_WHISPER__LOG_LEVEL: info
              WYOMING_WHISPER__PORT: &port 10300
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 4Gi
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
    service:
      app:
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: 192.168.10.40
        controller: wyoming-whisper
        ports:
          whisper:
            enabled: true
            port: *port
            primary: true
            protocol: TCP

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/renovate-operator.mogenius.com/renovatejob_v1alpha1.json
apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: renovate-go
spec:
  extraEnv:
    - name: LOG_LEVEL
      value: debug
    - name: RENOVATE_ONBOARDING_CONFIG
      value: |
        {
          "$schema": "https://docs.renovatebot.com/renovate-schema.json",
          "extends": [
            'config:recommended'
          ]
        }
    - name: RENOVATE_ALLOWED_COMMANDS
      value: '["^install-tool mise \\d+\\.\\d+\\.\\d+$", "^mise (trust --quiet \\.mise/config\\.toml|lock|install --locked|run regenerate)$"]'
    - name: RENOVATE_ALLOWED_UNSAFE_EXECUTIONS
      value: '["mise"]'
    - name: RENOVATE_REDIS_URL
      value: "redis://dragonfly.database.svc.cluster.local:6379/2"
  image: ghcr.io/renovatebot/renovate:45.1.0@sha256:1438b77f8ed338e64c7a8bf53d40724fb6229690bcd3a42264158b0768ba9aba
  parallelism: 10
  provider:
    name: github
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
  schedule: "7,37 * * * *"
  secretRef: renovate-secret
  discoveryFilters:
    - "Faustvii/warden"
    - "Faustvii/shelfglade"
  webhook:
    authentication:
      enabled: true
      secretRef:
        key: token
        name: renovate-webhook-token
    enabled: true

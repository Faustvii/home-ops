---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/networking.k8s.io/networkpolicy_v1.json
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vpn-proxy-ingress
spec:
  # The proxy is unauthenticated, so only the listed clients may use it.
  # The egress lock (DNS only on eth0) comes from components/vpn-egress-lock.
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vpn-proxy
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: media-management
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prowlarr
      ports:
        - port: 8888
          protocol: TCP
        - port: 1080
          protocol: TCP

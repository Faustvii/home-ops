---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app vpn-proxy
spec:
  chartRef:
    kind: OCIRepository
    name: vpn-proxy
  interval: 1h
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      annotations:
        k8s.v1.cni.cncf.io/networks: |-
          [{
            "name": "vpn",
            "namespace": "network",
            "ips": ["192.168.90.11/24"],
            "mac": "02:84:a6:de:a9:df"
          }]
      securityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
    controllers:
      *app :
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: gogost/gost
              tag: 3.3.1@sha256:c3f849542469bc6027cd38d9a7ef86e8efbcc1176551a3ace8df85ef90a9c5b9
            args:
              - -C
              - /etc/gost/proxy.yaml
            env:
              TZ: ${TZ}
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  failureThreshold: 5
                  periodSeconds: 30
                  tcpSocket:
                    port: &http 8888
                  timeoutSeconds: 5
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
                  tcpSocket:
                    port: *http
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true
    persistence:
      config:
        type: configMap
        name: vpn-proxy-config
        globalMounts:
          - path: /etc/gost
            readOnly: true
    service:
      app:
        ports:
          http:
            port: *http
          socks:
            port: 1080

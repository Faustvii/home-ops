---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app vpn-proxy
  namespace: &namespace media-management
spec:
  components:
    - ../../../../components/vpn-egress-lock
  dependsOn:
    - name: multus-networks
      namespace: network
  interval: 1h
  path: ./kubernetes/apps/media-management/vpn-proxy/app
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace

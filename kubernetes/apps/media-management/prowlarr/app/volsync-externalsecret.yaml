---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: prowlarr-volsync
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: prowlarr-volsync-secret
    template:
      data:
        AWS_ACCESS_KEY_ID: "{{ .AWS_ACCESS_KEY_ID }}"
        AWS_SECRET_ACCESS_KEY: "{{ .AWS_SECRET_ACCESS_KEY }}"
        RESTIC_PASSWORD: "{{ .RESTIC_PASSWORD }}"
        # Legacy clusterRC3 (TrueCharts) layout: <bucket>/<release>/volsync/<pvc>-volsync-<name>
        RESTIC_REPOSITORY: "s3:{{ .S3_HOST }}/{{ .S3_PREFIX }}-homepage/prowlarr/volsync/config-volsync-config"
  dataFrom:
    - find:
        path: /volsync

---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: prowlarr-definitions
    files:
      - yourbittorrentmovie.yml=./resources/yourbittorrentmovie.yml
      - yourbittorrenttv.yml=./resources/yourbittorrenttv.yml
generatorOptions:
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
  disableNameSuffixHash: true
resources:
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./ocirepository.yaml

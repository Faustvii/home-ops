---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: readarr
spec:
  accessModes:
    - ReadWriteOnce
  dataSourceRef:
    apiGroup: volsync.backube
    kind: ReplicationDestination
    name: readarr-dst
  resources:
    requests:
      storage: 10Gi
  storageClassName: miroir-replicated

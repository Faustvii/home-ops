---
# yaml-language-server: $schema=https://raw.githubusercontent.com/aclerici38/pocket-id-operator/main/dist/schemas/pocketidoidcclient_v1alpha1.json
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: readarr
spec:
  allowedUserGroups:
    - name: readarr-users
  callbackUrls:
    - https://readarr.${SECRET_DOMAIN_1}/oauth2/callback
  launchUrl: https://readarr.${SECRET_DOMAIN_1}
  logoutCallbackUrls:
    - https://readarr.${SECRET_DOMAIN_1}/
  name: Readarr
  pkceEnabled: false
  secret:
    keys:
      clientID: client-id
      clientSecret: client-secret
    name: readarr-oidc-credentials

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/grafana.integreatly.org/grafanamanifest_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaManifest
metadata:
  name: rreading-glasses
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  template:
    apiVersion: dashboard.grafana.app/v2
    kind: Dashboard
    metadata:
      name: rreading-glasses
    spec:
      annotations:
        - kind: AnnotationQuery
          spec:
            builtIn: true
            enable: true
            hide: true
            iconColor: rgba(0, 211, 255, 1)
            legacyOptions:
              type: dashboard
            name: Annotations & Alerts
            query:
              datasource:
                name: -- Grafana --
              group: grafana
              kind: DataQuery
              spec: {}
              version: v0
      cursorSync: "Off"
      editable: true
      elements:
        panel-1:
          kind: Panel
          spec:
            data:
              kind: QueryGroup
              spec:
                queries:
                  - kind: PanelQuery
                    spec:
                      hidden: false
                      query:
                        datasource:
                          name: ${datasource}
                        group: prometheus
                        kind: DataQuery
                        spec:
                          expr: sum(rg_controller_pending_operations{type="refresh", instance=~"$instance"})
                          legendFormat: __auto
                        version: v0
                      refId: A
                queryOptions: {}
                transformations: []
            description: ""
            id: 1
            links: []
            title: Pending Refreshes
            vizConfig:
              group: stat
              kind: VizConfig
              spec:
                fieldConfig:
                  defaults:
                    color:
                      mode: thresholds
                    thresholds:
                      mode: absolute
                      steps:
                        - color: green
                          value: null
                    unit: short
                  overrides: []
                options:
                  colorMode: value
                  graphMode: area
                  justifyMode: auto
                  orientation: auto
                  percentChangeColorMode: standard
                  reduceOptions:
                    calcs:
                      - lastNotNull
                    fields: ""
                    values: false
                  showPercentChange: true
                  textMode: auto
                  wideLayout: true
              version: ""

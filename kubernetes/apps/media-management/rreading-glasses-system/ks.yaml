---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app rreading-glasses-gr
  namespace: &namespace media-management
spec:
  components:
    - ../../../../components/database/postgres/standalone
  interval: 1h
  path: ./kubernetes/apps/media-management/rreading-glasses-system/goodreads
  postBuild:
    substitute:
      APP: *app
      DATABASE_BACKUP_SCHEDULE: 0 15 3 * * 0 # weekly, Sunday 03:15
      DATABASE_BUCKET_SIZE: 150Gi
      DATABASE_RETENTION: 7d
      DATABASE_STORAGE: 100Gi
      NAMESPACE: *namespace
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app rreading-glasses-dashboard
  namespace: &namespace media-management
spec:
  interval: 1h
  path: ./kubernetes/apps/media-management/rreading-glasses-system/dashboard
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace

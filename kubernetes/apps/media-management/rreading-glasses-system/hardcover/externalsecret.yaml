---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rreading-glasses-hc
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    creationPolicy: Owner
    name: rreading-glasses-hc-secret
    template:
      data:
        # Hardcover API token, including the "Bearer " prefix.
        HARDCOVER_AUTH: "{{ .HARDCOVER_AUTH }}"
  dataFrom:
    - find:
        path: /rreading-glasses

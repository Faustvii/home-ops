---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rreading-glasses-hc
spec:
  chartRef:
    kind: OCIRepository
    name: rreading-glasses-hc
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
    controllers:
      rreading-glasses-hc:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            args:
              - --upstream=api.hardcover.app
              - --verbose
            command: ["/main", "serve"]
            env:
              HARDCOVER_AUTH:
                valueFrom:
                  secretKeyRef:
                    key: HARDCOVER_AUTH
                    name: rreading-glasses-hc-secret
              POSTGRES_DATABASE:
                valueFrom:
                  secretKeyRef:
                    key: database
                    name: rreading-glasses-hc-postgres
              POSTGRES_HOST:
                valueFrom:
                  secretKeyRef:
                    key: host
                    name: rreading-glasses-hc-postgres
              POSTGRES_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    key: password
                    name: rreading-glasses-hc-postgres
              POSTGRES_USER:
                valueFrom:
                  secretKeyRef:
                    key: username
                    name: rreading-glasses-hc-postgres
              TZ: ${TZ}
            image:
              repository: ghcr.io/faustvii/rreading-glasses
              tag: hardcover-1.0.0@sha256:3637aa4da53dfa0c68a96125b64ca64a9783c35b1620589ec0dd8eedd6e7c624
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  failureThreshold: 5
                  periodSeconds: 15
                  tcpSocket:
                    port: &port 8788
                  timeoutSeconds: 5
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
                  tcpSocket:
                    port: *port
            resources:
              limits:
                memory: 1Gi
              requests:
                cpu: 100m
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true
    persistence:
      tmpfs:
        type: emptyDir
        advancedMounts:
          rreading-glasses-hc:
            app:
              - path: /tmp
                subPath: tmp
    route:
      app:
        hostnames:
          - rghc.${SECRET_DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: network
    service:
      app:
        ports:
          http:
            port: *port
    serviceMonitor:
      app:
        endpoints:
          - interval: 30s
            path: /debug/metrics
            port: http
            relabelings:
              # Replace the pod ip:port instance, which changes on every restart,
              # with the release name: rreading-glasses-gr, rreading-glasses-hc.
              - sourceLabels: [__meta_kubernetes_service_label_app_kubernetes_io_instance]
                targetLabel: instance
              - sourceLabels: [__meta_kubernetes_pod_name]
                targetLabel: pod

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/restore_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: tautulli-from-media
spec:
  credentialProjection:
    enabled: true
  mover:
    securityContext:
      runAsGroup: 1000
      runAsUser: 1000
  repository:
    kind: ClusterRepository
    name: nas
  source:
    identity:
      hostname: media
      offset: 0 # 0 = latest snapshot
      sourcePath: /pvc/tautulli
      username: tautulli
  target:
    populator: {}

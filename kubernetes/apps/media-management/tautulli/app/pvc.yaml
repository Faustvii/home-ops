kind: PersistentVolumeClaim
metadata:
  name: tautulli
spec:
  accessModes:
    - ReadWriteOnce
  dataSourceRef:
    apiGroup: kopiur.home-operations.com
    kind: Restore
    name: tautulli-from-media
  resources:
    requests:
      storage: 5Gi
  storageClassName: miroir-replicated

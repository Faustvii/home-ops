---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: media-management-books-nfs-pv
spec:
  accessModes:
    - ReadWriteMany
  capacity:
    storage: 1Mi
  mountOptions:
    - nfsvers=4
    - tcp
    - hard
    - noresvport
    - noatime
    - nodiratime
    - nolock
  nfs:
    path: ${NFS_PATH_MEDIA_BOOKS}
    server: ${NFS_SERVER_IP}
  persistentVolumeReclaimPolicy: Retain
  storageClassName: media-management-books-nfs
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: readarr-books-nfs-pvc
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Mi
  storageClassName: media-management-books-nfs
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: media-management-downloads-nfs-pv
spec:
  accessModes:
    - ReadWriteMany
  capacity:
    storage: 1Mi
  mountOptions:
    - nfsvers=4
    - tcp
    - hard
    - noresvport
    - noatime
    - nodiratime
    - nolock
  nfs:
    path: ${NFS_PATH_DOWNLOADS}
    server: ${NFS_SERVER_IP}
  persistentVolumeReclaimPolicy: Retain
  storageClassName: media-management-downloads-nfs
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: readarr-downloads-nfs-pvc
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Mi
  storageClassName: media-management-downloads-nfs

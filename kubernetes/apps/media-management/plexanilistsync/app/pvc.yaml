---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: plexanilistsync
spec:
  accessModes:
    - ReadWriteOnce
  dataSourceRef:
    apiGroup: kopiur.home-operations.com
    kind: Restore
    name: plexanilistsync-from-media
  resources:
    requests:
      storage: 1Gi
  storageClassName: miroir-replicated

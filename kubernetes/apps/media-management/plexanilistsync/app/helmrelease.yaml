---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plexanilistsync
spec:
  chartRef:
    kind: OCIRepository
    name: plexanilistsync
  interval: 1h
  values:
    defaultPodOptions:
      annotations:
        instrumentation.opentelemetry.io/inject-sdk: observability/instrumentation
        instrumentation.opentelemetry.io/container-names: app
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
    controllers:
      plexanilistsync:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/faustvii/plexanilistsync
              tag: 3.8.0@sha256:091d405f909e8f92a5b3870108e3733bb0bcf13828be718c90a74bc5c8966387
            env:
              OTEL_TRACES_SAMPLER: parentbased_always_on
              TZ: ${TZ}
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  failureThreshold: 5
                  periodSeconds: 15
                  tcpSocket:
                    port: &port 8080
                  timeoutSeconds: 5
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
                  tcpSocket:
                    port: *port
            resources:
              requests:
                cpu: 5m
              limits:
                memory: 512Mi
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true
          codeserver:
            image:
              repository: ghcr.io/coder/code-server
              tag: 4.141.0@sha256:72ab24b5680ee597dd647b30d82625752f40109b5f61bef90ffbf1ea1f02dbb8
            command: ["/usr/bin/entrypoint.sh"]
            args:
              - --auth
              - none
              - --bind-addr
              - 0.0.0.0:12321
              - --disable-telemetry
              - --disable-update-check
              - /app/config
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 1Gi
            securityContext: *securityContext
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /app/config
      tmpfs:
        type: emptyDir
        advancedMounts:
          plexanilistsync:
            app:
              - path: /tmp
                subPath: tmp
            codeserver:
              - path: /home/coder
                subPath: home
              - path: /tmp
                subPath: codeserver-tmp
    route:
      codeserver:
        hostnames:
          - "anilist-sync.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: codeserver
                port: 12321
    service:
      app:
        ports:
          http:
            port: 80
            targetPort: *port
      codeserver:
        ports:
          http:
            port: 12321

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app recyclarr
spec:
  chartRef:
    kind: OCIRepository
    name: recyclarr
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
    controllers:
      *app :
        containers:
          app:
            image:
              repository: ghcr.io/recyclarr/recyclarr
              tag: 9.0.0@sha256:4973d11b18b5ef09fb226f4161eecb16434ff7e6b43c56d50fceb52fb22c66c7
            env:
              TZ: UTC
            envFrom:
              - secretRef:
                  name: *app
              - secretRef:
                  name: recyclarr-api-key
            ports:
              - containerPort: 7982
                name: http
                protocol: TCP
              - containerPort: 7983
                name: management
                protocol: TCP
            # v9 runs a persistent server instead of a cron job. It opens no port until startup
            # finishes, which includes cloning the TRaSH Guides, so the startup budget is 5
            # minutes. Probes use the management port, which needs no API key.
            probes:
              liveness:
                enabled: true
                path: /livez
                port: management
                spec:
                  failureThreshold: 3
                  periodSeconds: 30
                  timeoutSeconds: 3
                type: HTTP
              readiness:
                enabled: true
                path: /readyz
                port: management
                spec:
                  failureThreshold: 3
                  periodSeconds: 5
                  timeoutSeconds: 3
                type: HTTP
              startup:
                enabled: true
                path: /livez
                port: management
                spec:
                  failureThreshold: 150
                  periodSeconds: 2
                  timeoutSeconds: 3
                type: HTTP
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
      tmp:
        type: emptyDir

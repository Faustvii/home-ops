---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nextcloud
spec:
  chartRef:
    kind: OCIRepository
    name: nextcloud
  interval: 1h
  values:
    cronjob:
      enabled: true
      sidecar:
        # The stock /cron.sh needs root; cron.php must run as the user that
        # owns config.php.
        command:
          - /bin/sh
          - -c
          - while true; do php -f /var/www/html/cron.php; sleep 300; done
        securityContext:
          runAsGroup: 1000
          runAsNonRoot: true
          runAsUser: 1000
      type: sidecar
    externalDatabase:
      enabled: true
      type: postgresql
      existingSecret:
        enabled: true
        secretName: nextcloud-postgres
        usernameKey: username
        passwordKey: password
        hostKey: host
        databaseKey: database
    externalRedis:
      enabled: true
      host: dragonfly.database.svc.cluster.local
      port: "6379"
    httpRoute:
      enabled: true
      hostnames:
        - cloud.${SECRET_DOMAIN_1}
      parentRefs:
        - name: envoy-external
          namespace: network
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          timeouts:
            request: 0s
    image:
      flavor: fpm-alpine
      tag: 33.0.3-fpm-alpine@sha256:f2f6f40258e613d58db1c746293e382311165feaac293b5e2e8c9d278cea165d
    internalDatabase:
      enabled: false
    nextcloud:
      datadir: /var/www/html/data
      existingSecret:
        enabled: true
        secretName: nextcloud-secret
        usernameKey: nextcloud-username
        passwordKey: nextcloud-password
      configs:
        # config.php wins over snippets, so the default_phone_region key must
        # stay out of config.php (occ config:system:delete default_phone_region)
        phone.config.php: |-
          <?php
          $CONFIG = array (
            'default_phone_region' => getenv('NEXTCLOUD_PHONE_REGION'),
          );
      # The entrypoint (non-root) writes redis-session.ini, so put it on a
      # writable volume
      extraInitContainers:
        - name: init-redis-session-ini
          image: docker.io/library/alpine:3.24@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
          command:
            - /bin/sh
            - -c
            - touch /php-confd/redis-session.ini
          securityContext:
            runAsGroup: 1000
            runAsUser: 1000
          volumeMounts:
            - name: php-confd
              mountPath: /php-confd
      extraVolumes:
        - name: php-confd
          emptyDir: {}
      extraEnv:
        - name: NEXTCLOUD_PHONE_REGION
          valueFrom:
            secretKeyRef:
              name: nextcloud-secret
              key: phone-region
      host: cloud.${SECRET_DOMAIN_1}
      podSecurityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      securityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
    nginx:
      enabled: true
      image:
        repository: docker.io/library/nginx
        tag: 1.31-alpine@sha256:892bb2152464f0c5d8972593a5f5afaf8054552580b699d95f8ff4af08c2d33d
    persistence:
      enabled: true
      existingClaim: nextcloud
      nextcloudData:
        enabled: true
        existingClaim: nextcloud-data-nfs-pvc
    resources:
      limits:
        memory: 2Gi
      requests:
        cpu: 100m
        memory: 512Mi
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: nextcloud
            patch: |-
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: nextcloud
              spec:
                template:
                  spec:
                    # The chart always mounts the data volume at a "data"
                    # subPath. The share is the data directory itself, so
                    # mount its root.
                    containers:
                      - name: nextcloud
                        volumeMounts:
                          - name: php-confd
                            mountPath: /usr/local/etc/php/conf.d/redis-session.ini
                            subPath: redis-session.ini
                          - name: nextcloud-data
                            mountPath: /var/www/html/data
                            subPath: null
                      - name: nextcloud-nginx
                        volumeMounts:
                          - name: nextcloud-data
                            mountPath: /var/www/html/data
                            subPath: null
                      - name: nextcloud-cron
                        volumeMounts:
                          - name: nextcloud-data
                            mountPath: /var/www/html/data
                            subPath: null

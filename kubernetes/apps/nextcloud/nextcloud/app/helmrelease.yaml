---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nextcloud
spec:
  chartRef:
    kind: OCIRepository
    name: nextcloud
  interval: 1h
  # Suspended until the old html/config/database are copied in; a start on
  # empty volumes would run the installer against the live data share.
  suspend: true
  values:
    cronjob:
      enabled: true
      type: sidecar
    externalDatabase:
      enabled: true
      type: postgresql
      existingSecret:
        enabled: true
        secretName: nextcloud-postgres
        usernameKey: username
        passwordKey: password
        hostKey: host
        databaseKey: database
    externalRedis:
      enabled: true
      host: dragonfly.database.svc.cluster.local
      port: "6379"
    httpRoute:
      enabled: true
      hostnames:
        - cloud.${SECRET_DOMAIN_1}
      parentRefs:
        - name: envoy-external
          namespace: network
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          timeouts:
            request: 0s
    image:
      flavor: fpm-alpine
      tag: 33.0.3-fpm-alpine@sha256:f2f6f40258e613d58db1c746293e382311165feaac293b5e2e8c9d278cea165d
    internalDatabase:
      enabled: false
    nextcloud:
      datadir: /var/www/html/data
      existingSecret:
        enabled: true
        secretName: nextcloud-secret
        usernameKey: nextcloud-username
        passwordKey: nextcloud-password
      configs:
        # config.php wins over snippets, so the default_phone_region key must
        # stay out of config.php (occ config:system:delete default_phone_region)
        phone.config.php: |-
          <?php
          $CONFIG = array (
            'default_phone_region' => getenv('NEXTCLOUD_PHONE_REGION'),
          );
      extraEnv:
        - name: NEXTCLOUD_PHONE_REGION
          valueFrom:
            secretKeyRef:
              name: nextcloud-secret
              key: phone-region
      host: cloud.${SECRET_DOMAIN_1}
      podSecurityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      securityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
    nginx:
      enabled: true
      image:
        repository: docker.io/library/nginx
        tag: 1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    persistence:
      enabled: true
      existingClaim: nextcloud
      nextcloudData:
        enabled: true
        existingClaim: nextcloud-data-nfs-pvc
    resources:
      limits:
        memory: 2Gi
      requests:
        cpu: 100m
        memory: 512Mi

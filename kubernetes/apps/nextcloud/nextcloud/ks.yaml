---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app nextcloud
  namespace: &namespace nextcloud
spec:
  components:
    - ../../../../components/kopiur
    - ../../../../components/database/postgres/standalone
    - ../../../../components/database/dragonfly
  dependsOn:
    - name: kopiur
      namespace: storage
    - name: nfs-pvcs
      namespace: nextcloud
  interval: 1h
  path: ./kubernetes/apps/nextcloud/nextcloud/app
  postBuild:
    substitute:
      APP: *app
      DATABASE_STORAGE: 5Gi
      KOPIUR_CAPACITY: 5Gi
      KOPIUR_PGID: "568"
      KOPIUR_PUID: "568"
      NAMESPACE: *namespace
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace

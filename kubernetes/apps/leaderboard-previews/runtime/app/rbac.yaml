---
# preview-applier (in `leaderboard`): the ResourceSet applies as it.
# preview-installer: helm-controller installs each preview as it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: preview-applier
rules:
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: ["ocirepositories"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: preview-applier
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: preview-applier
subjects:
  - kind: ServiceAccount
    name: preview-applier
    namespace: leaderboard
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: preview-installer
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: preview-installer
rules:
  # Helm release storage.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  # What app-template renders.
  - apiGroups: [""]
    resources: ["serviceaccounts", "services"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  # Readiness wait (kstatus reads a Deployment's ReplicaSets and Pods).
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: preview-installer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: preview-installer
subjects:
  - kind: ServiceAccount
    name: preview-installer
    namespace: leaderboard-previews

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# Default deny. Ingress from envoy-external and kubelet probes; egress and DNS
# only for the Azure AD hosts used at sign-in.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: leaderboard-previews
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: network
            app.kubernetes.io/name: envoy
            gateway.envoyproxy.io/owning-gateway-name: envoy-external
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    # Kubelet health checks originate on the node hosting the pod.
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchName: login.microsoftonline.com
              - matchName: graph.microsoft.com
    - toFQDNs:
        - matchName: login.microsoftonline.com
        - matchName: graph.microsoft.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP

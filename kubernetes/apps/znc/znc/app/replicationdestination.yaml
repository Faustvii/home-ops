---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/volsync.backube/replicationdestination_v1alpha1.json
apiVersion: volsync.backube/v1alpha1
kind: ReplicationDestination
metadata:
  name: znc-dst
  labels:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
spec:
  restic:
    accessModes:
      - ReadWriteOnce
    cacheAccessModes:
      - ReadWriteOnce
    cacheCapacity: 5Gi
    cacheStorageClassName: miroir-replicated-staging
    capacity: 5Gi
    cleanupCachePVC: true
    cleanupTempPVC: false # miroir snapshots need their source volume to restore
    copyMethod: Snapshot
    enableFileDeletion: true
    moverSecurityContext:
      fsGroup: 1000
      runAsGroup: 1000
      runAsUser: 1000
    repository: znc-volsync-secret
    storageClassName: miroir-replicated
    volumeSnapshotClassName: miroir-snap
  trigger:
    manual: restore-once

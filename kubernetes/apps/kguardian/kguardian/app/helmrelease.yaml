---
# yaml-language-server: $schema=https://k8s-schemas.m00nlit.dev/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kguardian
spec:
  interval: 15m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 1.29.2
  url: oci://ghcr.io/kguardian-dev/charts/kguardian
  # Not signed
---
# yaml-language-server: $schema=https://k8s-schemas.m00nlit.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app kguardian
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 30m
  values:
    controller:
      excludedNamespaces:
        - kguardian
        - kube-system
        - renovate

    ai:
      enabled: true
      provider: openai
      secret: *app
      model: self-qwen3.8-flash-next
      baseUrl: http://modelrouter-router-proxy.ai.svc.cluster.local:8080/v1
      mcp:
        enabled: true
        auth:
          existingSecret: *app
          secretKey: MCP_TOKEN

    seccomp:
      distribute: false

    frontend:
      allowedHosts:
        - kguardian.${SECRET_DOMAIN}

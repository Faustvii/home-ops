---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kguardian
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: kguardian
    template:
      data:
        MCP_TOKEN: "{{ .MCP_TOKEN }}"
  dataFrom:
    - find:
        path: /kguardian

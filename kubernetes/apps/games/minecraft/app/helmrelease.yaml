---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: minecraft
spec:
  interval: 5m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 5.1.3
  url: oci://ghcr.io/itzg/minecraft-server-charts/minecraft
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app minecraft
spec:
  chartRef:
    kind: OCIRepository
    name: minecraft
  interval: 1h
  values:
    deploymentAnnotations:
      configmap.reloader.stakater.com/reload: "minecraft-datapacks"
      secret.reloader.stakater.com/reload: &secret minecraft-secret

    extraEnv:
      DATAPACKS_FILE: /extras/datapacks.txt
      ENABLE_ROLLING_LOGS: true
      GENERATE_LOG4J2_CONFIG: true
      GID: 1000
      HIDE_ONLINE_PLAYERS: true
      MAX_MEMORY: 8G
      STOP_SERVER_ANNOUNCE_DELAY: 30
      TZ: "Europe/Paris"
      UID: 1000
      USE_AIKAR_FLAGS: true

    extraVolumes:

      - volumeMounts:
          - mountPath: /extras/datapacks.txt
            name: datapacks
            readOnly: true
            subPath: datapacks.txt
        volumes:
          - configMap:
              name: minecraft-datapacks
            name: datapacks
    image:
      repository: ghcr.io/itzg/minecraft-server
      tag: 2026.8.0-java25@sha256:e3335993929a1565f73c30b2041bcbc1473fc9c406fdd5a0d0ea24c08ef73320
    minecraftServer:
      difficulty: hard
      eula: true
      extraPorts:
        - containerPort: 24454
          name: voice
          protocol: UDP
          service:
            embedded: true
            enabled: true
            port: 24454
            type: LoadBalancer
        - containerPort: 8100
          name: bluemap
          protocol: TCP
          service:
            embedded: false
            enabled: true
            port: 8100
            type: ClusterIP
        - containerPort: 25585
          name: metrics
          protocol: TCP
          service:
            embedded: true
            enabled: true
            port: 25585
            type: ClusterIP
      levelSeed: "5143877906783391683"
      maxPlayers: 24
          # not updated yet for 1.21.11
          # - fabricexporter
          # - async
          # - noisiumforked
          # - krypton
          # - carpet
      modUrls:
        - "https://github.com/gnembon/fabric-carpet/releases/download/1.4.193/fabric-carpet-1.21.11-1.4.193+v251211.jar"
        - "https://github.com/ruscalworld/fabric-exporter/releases/download/v1.0.19/fabricexporter-1.0.19.jar"
      modrinth:
        allowedVersionType: alpha
        downloadDependencies: required
        projects:
          - bluemap
          - armor-poser
          - audioplayer
          - fabric-api
          - chunky
          - spark
          - simple-voice-chat
          - servux
          - vmp-fabric
          - c2me-fabric
          - scalablelux
          - ferrite-core
          - lithium
          - servercore
      motd: "Let's goo"
      ops: "liope"
      pvp: true
      rcon:
        embedded: true
        enabled: true
        serviceType: ClusterIP
      resourcePackEnforce: true
      resourcePackSha: "d25b960c398c9ad111de8c42316b6f6bb48f9d05" # sha-1 digest in lowercase hexadecimal
      resourcePackUrl: "https://github.com/Faustvii/minds_packs/releases/download/v0.0.2-mc1.21.11/MindsResources_v0.0.2_mc_1.21.11_rp.zip"
      serviceType: LoadBalancer
      type: FABRIC
      vanillaTweaksShareCodes:
        - "JV0FV7"
        - "FF8soj"
      # renovate: datasource=custom.minecraft-release
      version: 1.21.11
      viewDistance: 16
      whitelist: "liope,OliverWHennings,roflbobl,FranzVDB,lil_havfrue,AndyBeTrollin,inebuni,Djonn,Noerlem,Svend_Bueskytte,v1z3s,dkcom,FoshuMG,Shazbotz,Simmetopia,Alveel,DerRune,HueN77,EHasseltoft,Sanctidus"
      worldSaveName: "Wonderland"

    persistence:
      dataDir:
        enabled: true
        existingClaim: *app

    podSecurityContext:
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
      runAsGroup: 1000
      runAsNonRoot: true
      runAsUser: 1000
    readinessProbe:
      initialDelaySeconds: 15
    resources:
      limits:
        memory: 12Gi
      requests:
        cpu: 1000m
        memory: 4Gi

    serviceAnnotations:
      lbipam.cilium.io/ips: "192.168.10.31"
      mc-router.itzg.me/externalServerName: "mc.${SECRET_DOMAIN}"
    serviceLabels:
      io.cilium/ippool: public

    sidecarContainers:
      - args:
          - --auth
          - none
        image: "ghcr.io/coder/code-server:4.132.0"
        imagePullPolicy: IfNotPresent
        name: vscode
        ports:
          - containerPort: 8080
            name: vscode
        resources:
          limits:
            cpu: 1
            memory: 1Gi
          requests:
            cpu: 10m
            memory: 64Mi
        volumeMounts:
          - mountPath: /data # mount Minecraft world + configs
            name: datadir
    terminationGracePeriodSeconds: 90
        # - "https://cdn.modrinth.com/data/YoRtMPzM/versions/ze2xyOSp/SHA1Runtime-1.21.10-1.4.1.jar" # SHA1Runtime crashes the server on player connect


  valuesFrom:
    - kind: Secret
      name: *secret
      targetPath: minecraftServer.rcon.password
      valuesKey: RCON_PASSWORD

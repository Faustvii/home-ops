---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app minecraft
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/kopiur
  interval: 1h
  path: ./kubernetes/apps/games/minecraft/app
  postBuild:
    substitute:
      APP: *app
      KOPIUR_SNAPSHOT_SCHEDULE: "H */6 * * *"
      KOPIUR_CAPACITY: 20Gi
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: games
  timeout: 5m
  wait: false
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app minecraft-test
spec:
  dependsOn:
    - name: minecraft
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/kopiur
  interval: 1h
  path: ./kubernetes/apps/games/minecraft/test
  postBuild:
    substitute:
      APP: *app
      KOPIUR_SNAPSHOT_SCHEDULE: "H */3 * * *"
      KOPIUR_CAPACITY: 20Gi
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: games
  timeout: 5m
  wait: false

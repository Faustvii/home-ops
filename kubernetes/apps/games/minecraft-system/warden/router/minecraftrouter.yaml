---
apiVersion: warden.faustvii.github.io/v1alpha1
kind: MinecraftRouter
metadata:
  name: warden
spec:
  voiceChat:
    enabled: true
  default: true
  fallbackServerRef:
    name: main
  service:
    annotations:
      # k8s-gateway only: cloudflare-dns reads DNSEndpoints, so the name stays on the LAN
      external-dns.kubernetes.io/hostname: mc.${SECRET_DOMAIN},minecraft.${SECRET_DOMAIN},fog.mc.${SECRET_DOMAIN}
      lbipam.cilium.io/ips: 192.168.10.30

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app minecraft-1-21-4
spec:
  chartRef:
    kind: OCIRepository
    name: minecraft-1-21-4
  interval: 1h
  postRenderers:
    - kustomize:
        patches:
          # mc-router scales the server between 0 and 1; keep replicas out of
          # the rendered manifest so an upgrade does not reset it to 1
          - patch: |-
              - op: remove
                path: /spec/replicas
            target:
              kind: StatefulSet
              name: minecraft-1-21-4
  values:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: home-ops/cpu-single
                  operator: Gt
                  values: ["3500"]
    extraEnv:
      ALLOW_FLIGHT: true
      ENABLE_ROLLING_LOGS: true
      GENERATE_LOG4J2_CONFIG: true
      GID: 1000
      HIDE_ONLINE_PLAYERS: true
      MAX_MEMORY: 4G
      SIMULATION_DISTANCE: 10
      STOP_SERVER_ANNOUNCE_DELAY: 30
      TZ: "Europe/Paris"
      UID: 1000
      USE_AIKAR_FLAGS: true

    image:
      repository: ghcr.io/itzg/minecraft-server
      tag: 2026.10.0-java21@sha256:d4057e7019e9b19f25e039d4a204cc502e1a112d1a2305966a534f3d7079e644
    # the pod joins the Service only once Ready, so poll quickly while it starts
    # and wake as soon as the server accepts connections
    livenessProbe:
      initialDelaySeconds: 0
    readinessProbe:
      initialDelaySeconds: 0
      periodSeconds: 2
    startupProbe:
      enabled: true
      failureThreshold: 600
      periodSeconds: 1
    minecraftServer:
      difficulty: hard
      eula: true
      extraPorts:
        - containerPort: 24454
          name: voice
          protocol: UDP
          service:
            embedded: true
            enabled: true
            port: 24454
            type: ClusterIP
      levelSeed: "-7207479545471200141"
      maxPlayers: 24
      modrinth:
        allowedVersionType: alpha
        downloadDependencies: required
        projects:
          - armor-poser
          - async
          - audioplayer
          - c2me-fabric
          - carpet
          - chunky
          - collective
          - fabric-api
          - ferrite-core
          - krypton
          - lithium
          - noisium
          - scaffolding-drops-nearby
          - scalablelux
          - servercore
          - servux
          - simple-voice-chat
          - spark
          - vmp-fabric
      motd: "MindsCraft"
      ops: "liope"
      pvp: true
      rcon:
        embedded: true
        enabled: true
        serviceType: ClusterIP
      serviceType: ClusterIP
      spawnProtection: 0
      type: FABRIC
      version: 1.21.4
      viewDistance: 10
      whitelist: "Liope,inebuni,AndyBeTrollin,roflbobl,Noerlem,OliverWHennings,lil_havfrue,Svend_Bueskytte,Djonn,FranzVDB"
      worldSaveName: "world"

    persistence:
      dataDir:
        enabled: true
        existingClaim: *app

    podSecurityContext:
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
      runAsGroup: 1000
      runAsNonRoot: true
      runAsUser: 1000
    resources:
      limits:
        memory: 6Gi
      requests:
        cpu: 1000m
        memory: 1Gi

    serviceAnnotations:
      mc-router.itzg.me/externalServerName: "1-21-4.mc.${SECRET_DOMAIN}"

    # mc-router only scales StatefulSets
    strategyType: RollingUpdate
    terminationGracePeriodSeconds: 90
    workloadAsStatefulSet: true

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app minecraft-1-21-4
  namespace: &namespace games
spec:
  components:
    - ../../../../../../components/kopiur
  dependsOn:
    - name: kopiur
      namespace: storage
    - name: minecraft
  interval: 1h
  path: ./kubernetes/apps/games/minecraft-system/servers/1-21-4/app
  postBuild:
    substitute:
      APP: *app
      KOPIUR_CAPACITY: 20Gi
      KOPIUR_SNAPSHOT_SCHEDULE: "H */12 * * *"
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mc-router
spec:
  chartRef:
    kind: OCIRepository
    name: mc-router
  interval: 1h
  dependsOn: []
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    defaultPodOptions:
      automountServiceAccountToken: true
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
    controllers:
      router:
        replicas: 1
        serviceAccount:
          identifier: mc-router
        strategy: RollingUpdate
        containers:
          mc-router:
            image:
              pullPolicy: IfNotPresent
              repository: ghcr.io/itzg/mc-router
              tag: 1.48.0@sha256:3a9ece070b97c8c55666810fc81cb209e1dd775fce792187e296626b786859cc
            env:
              API_BINDING: ":8081"
              AUTO_SCALE_ASLEEP_MOTD: "Server is sleeping. Connect to wake it up, then give it a few minutes to start."
              AUTO_SCALE_DOWN: "true"
              AUTO_SCALE_DOWN_AFTER: 2m
              AUTO_SCALE_LOADING_MOTD: "Server is starting up, please try again in a minute."
              AUTO_SCALE_UP: "true"
              CONNECTION_RATE_LIMIT: "10"
              IN_KUBE_CLUSTER: "true"
              PORT: "25565"
              WEBHOOK_REQUIRE_USER: "true"
              WEBHOOK_URL: "http://localhost:8080/event"
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true
          svc-router:
            image:
              pullPolicy: IfNotPresent
              repository: ghcr.io/jlschuler99/svc-router
              tag: 0.0.2
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                cpu: 1
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true
    rbac:
      bindings:
        mc-router:
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            identifier: mc-router
            kind: ClusterRole
          subjects:
            - identifier: mc-router
          type: ClusterRoleBinding
      roles:
        mc-router:
          rules:
            - apiGroups: [""]
              resources: ["services"]
              verbs: ["watch", "list"]
            - apiGroups: ["apps"]
              resources: ["statefulsets"]
              verbs: ["watch", "list", "patch"]
            - apiGroups: ["apps"]
              resources: ["statefulsets/scale"]
              verbs: ["get"]
          type: ClusterRole
    service:
      router:
        type: LoadBalancer
        annotations:
          external-dns.kubernetes.io/hostname: mc.${SECRET_DOMAIN}, minecraft.${SECRET_DOMAIN}
          lbipam.cilium.io/ips: 192.168.10.30
        ports:
          minecraft:
            port: 25565
            protocol: TCP
          voice:
            port: 24454
            protocol: UDP
    serviceAccount:
      mc-router:
        enabled: true

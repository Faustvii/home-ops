---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app archisteamfarm
spec:
  chartRef:
    kind: OCIRepository
    name: archisteamfarm
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
    controllers:
      *app :
        containers:
          app:
            image:
              repository: ghcr.io/justarchinet/archisteamfarm
              tag: 6.3.10.6@sha256:200d6792d5226bb6c1495fd3ba65a8898d88b60707efb761f2d79916910c708c
            env:
              TZ: UTC
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  failureThreshold: 3
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  tcpSocket:
                    port: &port 1242
                  timeoutSeconds: 1
              readiness: *probes
            resources:
              requests:
                cpu: 5m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          *app :
            app:
              - path: /app/config
                subPath: config
              - path: /app/plugins
                subPath: plugins
      logs:
        type: emptyDir
        advancedMounts:
          *app :
            app:
              - path: /app/logs
      tmp:
        type: emptyDir
    route:
      app:
        hostnames: ["asf.${SECRET_DOMAIN_1}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
    service:
      app:
        ports:
          http:
            port: *port

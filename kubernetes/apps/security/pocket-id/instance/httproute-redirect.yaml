---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pocket-id-legacy-redirect
spec:
  hostnames: ["idm.${SECRET_DOMAIN}"]
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  rules:
    - filters:
        - requestRedirect:
            hostname: idm.${SECRET_DOMAIN_1}
            statusCode: 301
          type: RequestRedirect

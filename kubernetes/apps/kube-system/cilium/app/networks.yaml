---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumloadbalancerippool_v2.json
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: pool
spec:
  allowFirstLastIPs: "No"
  blocks:
    - cidr: "192.168.10.0/24"
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliuml2announcementpolicy_v2alpha1.json
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: l2-policy
spec:
  loadBalancerIPs: true
  # Only the bond: talos-03 also has ens5 (TrueNAS link) as a Cilium device.
  interfaces:
    - ^bond[0-9]+$
  # Not talos-03: it is a macvtap VM on TrueNAS, and TrueNAS cannot reach an
  # IP that talos-03 announces on VLAN 10 (for example the Garage RPC LB IPs).
  nodeSelector:
    matchExpressions:
      - key: kubernetes.io/hostname
        operator: NotIn
        values:
          - talos-03

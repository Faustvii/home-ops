---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: drm-exporter
spec:
  chartRef:
    kind: OCIRepository
    name: drm-exporter
  interval: 1h
  values:
    dra:
      deviceClassName: gpu.amd.com
      enabled: true
    monitoring:
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          matchLabels:
            dashboards: grafana
      serviceMonitor:
        enabled: true
    nodeSelector:
      topology.kubernetes.io/gpus: amd
    resources:
      limits:
        memory: 128Mi
      requests:
        cpu: 10m
    securityContext:
      capabilities:
        add:
          - PERFMON
    tolerations:
      - effect: NoSchedule
        key: llm-workload
        operator: Exists

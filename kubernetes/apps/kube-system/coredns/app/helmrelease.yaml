---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: coredns
spec:
  chartRef:
    kind: OCIRepository
    name: coredns
  interval: 1h
  values:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: Exists
    fullnameOverride: coredns
    image:
      repository: mirror.gcr.io/coredns/coredns
    k8sAppLabelOverride: kube-dns
    replicaCount: 2
    servers:
      - plugins:
          - configBlock: |-
              authority "{{ .Zone }} 60 IN SOA ns.dns.cluster.local. hostmaster.cluster.local. (1 60 60 60 60)"
            name: template
            parameters: ANY AAAA
          - name: errors
          - configBlock: |-
              lameduck 5s
            name: health
          - name: ready
          - configBlock: |-
              pods verified
              fallthrough in-addr.arpa ip6.arpa
            name: kubernetes
            parameters: cluster.local in-addr.arpa ip6.arpa
          - name: autopath
            parameters: "@kubernetes"
          - name: forward
            parameters: . /etc/resolv.conf
          - configBlock: |-
              prefetch 20
              serve_stale
              servfail 0
            name: cache
          - name: loop
          - name: reload
          - name: loadbalance
          - name: prometheus
            parameters: 0.0.0.0:9153
          - configBlock: |-
              class error
            name: log
        port: 53
        zones:
          - scheme: dns://
            use_tcp: true
            zone: .
    service:
      clusterIP: "10.43.0.10"
      name: kube-dns
    serviceAccount:
      create: true
    tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
        operator: Exists

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/v1.35.0/runtimeclass-node-v1.json
# runsc handler is registered by the siderolabs/gvisor Talos extension
# (talos/schematics/*.yaml); every node must run it before pods use this class.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
handler: runsc

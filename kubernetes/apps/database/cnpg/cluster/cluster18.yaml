---
#yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: &name postgres
  annotations:
    cnpg.io/skipEmptyWalArchiveCheck: enabled
spec:
  instances: 2

  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:c7747d8d1049fff9cf30d9cd83d14d609c957afb5ffbcd114145f393ea1850e1

  # CNPG replicates between instances and backs up through barman, so the
  # volumes stay on a single node instead of being replicated by miroir too.
  affinity:
    podAntiAffinityType: required
  storage:
    size: 20Gi
    resizeInUseVolumes: false
    storageClass: miroir-local
  managed:
    services:
      additional:
        - selectorType: r
          serviceTemplate:
            metadata:
              name: postgres-18
              annotations:
                gatus.home-operations.com/enabled: "true"
                gatus.home-operations.com/endpoint: |
                  name: postgres-18
                  group: internal
                  ui:
                    hide-url: true
                    hide-hostname: true
            spec:
              type: ClusterIP
          updateStrategy: patch

  primaryUpdateStrategy: unsupervised
  # Switchover rejects an update that changes image and parameters at once;
  # apply them one at a time.
  primaryUpdateMethod: switchover

  bootstrap:
    recovery:
      source: &src source

  plugins:
    - name: &plugin barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: &store garage-store
        serverName: postgres-v1

  externalClusters:
    - name: source
      plugin:
        name: *plugin
        parameters:
          barmanObjectName: *store
          serverName: postgres-v1

  monitoring:
    enablePodMonitor: true

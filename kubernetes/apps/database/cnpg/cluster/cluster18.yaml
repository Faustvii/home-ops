---
#yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: &name postgres
  annotations:
    cnpg.io/skipEmptyWalArchiveCheck: enabled
spec:
  instances: 2

  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-standard-trixie@sha256:f0cc49632b5cc1e51f65ba03658c89bd31d64ea2672b14843a808a8d281417e1

  storage:
    size: 20Gi
    resizeInUseVolumes: false
  managed:
    roles:
      - name: infisical
        login: true
        ensure: present
        superuser: false
        disablePassword: false
        passwordSecret:
          name: infisical-postgres
      - name: bookarr
        login: true
        ensure: present
        superuser: false
        disablePassword: false
        passwordSecret:
          name: bookarr-postgres
      - name: pocket-id
        login: true
        ensure: present
        superuser: false
        disablePassword: false
        passwordSecret:
          name: pocket-id-postgres
      - name: booklore
        login: true
        ensure: present
        superuser: false
        disablePassword: false
        passwordSecret:
          name: booklore-postgres
      - name: litellm
        login: true
        ensure: present
        superuser: false
        disablePassword: false
        passwordSecret:
          name: litellm-postgres

    services:
      additional:
        - selectorType: r
          serviceTemplate:
            metadata:
              name: postgres-18
              annotations:
                gatus.home-operations.com/enabled: "true"
                gatus.home-operations.com/endpoint: |
                  name: postgres-18
                  group: internal
                  ui:
                    hide-url: true
                    hide-hostname: true
            spec:
              type: ClusterIP
          updateStrategy: patch

  bootstrap:
    recovery:
      source: &src source

  plugins:
    - name: &plugin barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: &store garage-store
        serverName: postgres-v1

  externalClusters:
    - name: source
      plugin:
        name: *plugin
        parameters:
          barmanObjectName: *store
          serverName: postgres-v1

  monitoring:
    enablePodMonitor: true

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: kritika-postgres
spec:
  instances: 2

  # The standard image ships pgvector; VectorChord is mounted from its
  # scratch image as an image-volume extension and preloaded. The vchord
  # pin in database.yaml moves with the scratch tag.
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:d72ace96f5803b12c341bb5dac48532e8c1f92f69e8a717a59d779bfc038dea9
  enableSuperuserAccess: false

  postgresql:
    extensions:
      - name: vchord
        image:
          reference: ghcr.io/tensorchord/vchord-scratch:pg18-v1.1.1@sha256:bdea43bed2a414e21bbf71767bf6f0739747ac480b267b51772dc214ac28dcb3
        dynamic_library_path:
          - /usr/lib/postgresql/18/lib/
        extension_control_path:
          - /usr/share/postgresql/18/
    shared_preload_libraries:
      - vchord
    # A commit waits for the standby while it is healthy; with the standby
    # down, writes go on without it.
    synchronous:
      method: any
      number: 1
      dataDurability: preferred

  primaryUpdateStrategy: unsupervised
  # Switchover rejects an update that changes image and parameters at once;
  # apply them one at a time.
  primaryUpdateMethod: switchover

  # CNPG replicates between instances and backs up through barman, so the
  # volumes stay on a single node instead of being replicated by miroir too.
  affinity:
    podAntiAffinityType: required
  storage:
    size: 10Gi
    storageClass: miroir-local

  bootstrap:
    recovery:
      source: source
      database: kritika
      owner: kritika
      secret:
        name: kritika-postgres-credentials

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: kritika-garage-store
        # Bump on every rebuild: a fresh initdb refuses a WAL archive that
        # already holds another timeline under the same name.
        serverName: kritika-postgres-v3

  externalClusters:
    - name: source
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: kritika-garage-store
          serverName: kritika-postgres-v2

  monitoring:
    enablePodMonitor: true

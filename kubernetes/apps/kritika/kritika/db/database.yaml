---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/database_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: kritika
spec:
  cluster:
    name: kritika-postgres
  name: kritika
  owner: kritika
  # Created by the operator as superuser, so the owner never needs it.
  extensions:
    - name: vector
      ensure: present
    - name: vchord
      # CNPG runs ALTER EXTENSION ... UPDATE when this moves; Renovate's cnpg
      # preset bumps it with the vchord-scratch tag in cluster.yaml.
      version: "1.1.1"
      ensure: present

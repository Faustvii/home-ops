---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/source.toolkit.fluxcd.io/gitrepository_v1.json
# kritika has no release or published OCI chart yet: build the chart from git,
# pinned to the commit the image digest in helmrelease.yaml was built from
# (org.opencontainers.image.revision). Bump both together.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: kritika
spec:
  interval: 1h
  url: https://github.com/home-operations/kritika
  ref:
    commit: 34c7358713b71839e2bcdb60b962aaeca27c1d0e
  ignore: |
    /*
    !/charts/kritika

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# GitHub App: shared with renovate-operator for now (same Infisical keys as
# renovate-operator/config/externalsecret.yaml); swap to a dedicated App later.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kritika
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: kritika-secret
    template:
      data:
        GITHUB_APP_CLIENT_ID: "{{ .app_client_id }}"
        GITHUB_APP_PRIVATE_KEY: "{{ .app_private_key }}"
        GITHUB_APP_WEBHOOK_SECRET: "{{ .webhook_secret }}"
        ADMIN_PASSWORD: "{{ .admin_password }}"
        # modelrouter and the embedder take no key in-cluster, but kritika
        # requires a provider apiKey reference.
        LOCAL_LLM_API_KEY: unused
      engineVersion: v2
  dataFrom:
    - find:
        path: /kritika

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kritika
spec:
  chartRef:
    kind: OCIRepository
    name: kritika
  interval: 1h
  values:
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"

    config:
      webUrl: https://${APP}.${SECRET_DOMAIN}
      runnerRuntimeClass: gvisor
      # Local models doing multi-step research outrun the 15m default.
      runnerDeadline: 30m

    # Passed through verbatim (no tpl); secrets are { env: NAME } from
    # envFrom/env below.
    configFile:
      auth:
        # Break-glass local admin; day-to-day sign-in is Pocket ID.
        admin:
          password: { env: ADMIN_PASSWORD }
        oidc:
          name: Pocket ID
          issuer: https://idm.${SECRET_DOMAIN}
          clientId: ${APP}
          clientSecret: { env: OIDC_CLIENT_SECRET }
          scopes: [openid, email, profile, groups]
          rolesClaim: groups
          roleMappingExpr: '"kritika-admins" in roles ? "admin" : ("kritika-users" in roles ? "member" : "")'
      apps:
        github:
          accounts: [Faustvii]
          clientId: { env: GITHUB_APP_CLIENT_ID }
          privateKey: { env: GITHUB_APP_PRIVATE_KEY }
          webhookSecret: { env: GITHUB_APP_WEBHOOK_SECRET }
      providers:
        modelrouter:
          type: openai
          baseUrl: http://modelrouter-router-proxy.ai.svc.cluster.local:8080/v1
          apiKey: { env: LOCAL_LLM_API_KEY }
        embed:
          type: openai
          baseUrl: http://qwen3-embedding.ai.svc.cluster.local:8080/v1
          apiKey: { env: LOCAL_LLM_API_KEY }
      defaults:
        models:
          review: modelrouter/self-qwen3.6
      embedding:
        model: embed/qwen3-embedding
        dims: 1024
        # Global, not per repo. Measured top-5 neighbours vs random pairs:
        # home-ops (YAML) 28% of random pairs pass 0.5, 3% pass 0.7;
        # bookarr keeps 93% of neighbours at 0.7.
        similarFloor: 0.7
      egress:
        allowHosts:
          - "*.githubusercontent.com"
          - ghcr.io
      # Per-repository rules and ignores live in each repo's .kritika.yaml;
      # agent may only be set here.
      repositories:
        Faustvii/*:
          agent:
            # The runner's -tools image provides these.
            commands: [gh, curl, jq, yq, rg, fd]

    envFrom:
      - secretRef:
          name: kritika-secret
    env:
      OIDC_CLIENT_SECRET:
        valueFrom:
          secretKeyRef:
            name: ${APP}-oidc-credentials
            key: client-secret

    database:
      owner:
        existingSecret: kritika-postgres-credentials
      app:
        existingSecret: kritika-postgres-app
      runner:
        existingSecret: kritika-postgres-runner

    httpRoute:
      enabled: true
      parentRefs:
        - name: envoy-external
          namespace: network
          sectionName: https
      hostnames:
        - ${APP}.${SECRET_DOMAIN}

    networkPolicy:
      enabled: true
      # 8080: modelrouter and the embedder in the ai namespace.
      # 10443: in-cluster *.${SECRET_DOMAIN} (e.g. Pocket ID) resolves to
      # the envoy LB, and Cilium enforces even standard NetworkPolicies on
      # the backend port.
      egressPorts: [443, 8080, 10443]

    monitoring:
      serviceMonitor:
        enabled: true

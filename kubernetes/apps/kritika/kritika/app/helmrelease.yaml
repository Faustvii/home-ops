---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kritika
spec:
  chartRef:
    kind: OCIRepository
    name: kritika
  interval: 1h
  values:
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"

    # Chart 0.0.6 defaults to one replica; keep two so a drain doesn't take
    # kritika down, and so the chart still renders the PodDisruptionBudget.
    replicas: 2

    config:
      webUrl: https://${APP}.${SECRET_DOMAIN}
      runnerRuntimeClass: gvisor
      # Local models doing multi-step research outrun the 15m default.
      runnerDeadline: 30m
      reviewWorkers: 1

    # Passed through verbatim (no tpl); secrets are { env: NAME } from
    # envFrom/env below.
    configFile:
      auth:
        # Break-glass local admin; day-to-day sign-in is Pocket ID.
        admin:
          password: { env: ADMIN_PASSWORD }
        oidc:
          name: Pocket ID
          issuer: https://idm.${SECRET_DOMAIN}
          clientId: ${APP}
          clientSecret: { env: OIDC_CLIENT_SECRET }
          scopes: [openid, email, profile, groups]
          rolesClaim: groups
          roleMappingExpr: '"kritika-admins" in roles ? "admin" : ("kritika-users" in roles ? "member" : "")'
      apps:
        github:
          accounts: [Faustvii]
          clientId: { env: GITHUB_APP_CLIENT_ID }
          privateKey: { env: GITHUB_APP_PRIVATE_KEY }
          webhookSecret: { env: GITHUB_APP_WEBHOOK_SECRET }
      providers:
        plan:
          type: chatgpt
        modelrouter:
          type: openai
          baseUrl: http://modelrouter-router-proxy.ai.svc.cluster.local:8080/v1
          apiKey: { env: LOCAL_LLM_API_KEY }
          # $/M tokens. Local inference costs nothing; priced as OpenRouter's
          # qwen/qwen3.8-flash (Alibaba endpoint) to show what it would cost.
          pricing:
            self-qwen3.8-flash-next:
              { input: 0.15, output: 0.47, cacheRead: 0.016, cacheWrite: 0.2 }
        embed:
          type: openai
          baseUrl: http://qwen3-embedding.ai.svc.cluster.local:8080/v1
          apiKey: { env: LOCAL_LLM_API_KEY }
      embedding:
        model: embed/qwen3-embedding
        dims: 1024
        # Global, not per repo. Measured top-5 neighbours vs random pairs:
        # home-ops (YAML) 28% of random pairs pass 0.5, 3% pass 0.7;
        similarFloor: 0.7
      review:
        model: modelrouter/self-qwen3.8-flash-next
      limits:
        concurrency: 1
      trigger:
        exclude: [{ name: forks, expr: pr.fork }]
      egress:
        allow:
          - "*"
          # konflate.${SECRET_DOMAIN} resolves to the envoy-external LB, a
          # private address the gateway refuses unless an entry covers it.
          - 192.168.10.23
        deny: ["*.internal"]
      # Per-repository rules and ignores live in each repo's .kritika.yaml;
      # agent may only be set here.
      repositories:
        Faustvii/*:
          review:
            approve: true
            # low matched medium on every important finding in the eval of 300 runs across 10 different cases,
            # with fewer steps and failed calls.
            effort: low
          confidence:
            model: plan/~sol-latest
            threshold: 4
            risk: medium
          agent:
            # Default is 20m; the review runner's deadline stretches to fit.
            timeout: 45m
            # Qwen likes to use all the steps available. Lowering it seems to have no impact on findings.
            steps: 24
            # The runner's -tools image provides the first six; konflate comes
            # from runner.tools below.
            commands: [gh, curl, jq, yq, rg, fd, konflate]
        # Here rather than in .kritika.yaml to keep the domain out of the repo;
        # rules add up by id with the repo's own.
        Faustvii/home-ops:
          rules:
            - id: konflate
              paths: ["kubernetes/**"]
              rule: >-
                konflate renders this pull request's Flux manifests with flate
                at the head and at the merge base and diffs the result, so it
                shows what the change does to the cluster that the git diff
                hides. Before anything else, run
                `konflate --server https://konflate.${SECRET_DOMAIN} <number>`
                with this pull request's number. It prints plain text, ready to
                read: konflate's summary (blast radius, cautions, image changes,
                render failures), a unified diff of every changed resource, and
                each CRD's schema changes as added, removed and changed paths.
                Where it cuts something for size it prints the exact command
                that fetches it. If it says the pull request is not tracked or
                still rendering, go on without it. Its output is what Flux will
                apply: use it to judge what the change really does and to catch
                a rendered change the diff or description does not explain. It
                is complete, so do not search the repository or the registry
                for rendered effects it does not list. When the summary says
                Routine, the change is only the version bump shown. Do not
                repeat its summary, which konflate already posts on the pull
                request.

    envFrom:
      - secretRef:
          name: kritika-secret
    env:
      OIDC_CLIENT_SECRET:
        valueFrom:
          secretKeyRef:
            name: ${APP}-oidc-credentials
            key: client-secret

    resources:
      requests: { cpu: 10m, memory: 64Mi }
      limits: { memory: 512Mi }

    runner:
      resources:
        requests: { cpu: 10m, memory: 256Mi }
        limits: { memory: 2Gi }
      # Mounted as an image volume at /opt/kritika/tools/<name> and put on the
      # runner's PATH; built from tools/konflate by .github/workflows/konflate-tool.yaml.
      tools:
        - name: konflate
          image: ghcr.io/faustvii/konflate-tool:latest@sha256:7f75ba444d4d077005baa203fdc6d6ba80f4572cddfea30f57cbc5ab53e94f8c
          path: /bin
          commands: [konflate]

    database:
      owner:
        existingSecret: kritika-postgres-credentials
      app:
        existingSecret: kritika-postgres-app
      runner:
        existingSecret: kritika-postgres-runner

    httpRoute:
      enabled: true
      parentRefs:
        - name: envoy-external
          namespace: network
          sectionName: https
      hostnames:
        - ${APP}.${SECRET_DOMAIN}

    networkPolicy:
      enabled: true
      # 8080: modelrouter and the embedder in the ai namespace.
      # 10443: in-cluster *.${SECRET_DOMAIN} (e.g. Pocket ID) resolves to
      # the envoy LB, and Cilium enforces even standard NetworkPolicies on
      # the backend port.
      egressPorts: [443, 8080, 10443]

    monitoring:
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          matchLabels:
            dashboards: grafana
      prometheusRule:
        enabled: true
      serviceMonitor:
        enabled: true

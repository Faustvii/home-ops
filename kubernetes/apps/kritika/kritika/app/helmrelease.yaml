---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kritika
spec:
  chartRef:
    kind: OCIRepository
    name: kritika
  interval: 1h
  values:
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"

    replicas: 2

    config:
      webUrl: https://${APP}.${SECRET_DOMAIN_1}
      reviewWorkers: 1
      comments:
        dashboard: false
      auth:
        # Break-glass local admin; day-to-day sign-in is Pocket ID.
        admin:
          password: { env: ADMIN_PASSWORD }
        oidc:
          name: Pocket ID
          issuer: https://idm.${SECRET_DOMAIN}
          clientId: ${APP}
          clientSecret: { env: OIDC_CLIENT_SECRET }
          scopes: [openid, email, profile, groups]
          rolesClaim: groups
          roleMappingExpr: '"kritika-admins" in roles ? "admin" : ("kritika-users" in roles ? "member" : "")'
      apps:
        github:
          accounts: [Faustvii]
          clientId: { env: GITHUB_APP_CLIENT_ID }
          privateKey: { env: GITHUB_APP_PRIVATE_KEY }
          webhookSecret: { env: GITHUB_APP_WEBHOOK_SECRET }
      providers:
        plan:
          type: chatgpt
        modelrouter:
          type: openai
          baseUrl: http://modelrouter-router-proxy.ai.svc.cluster.local:8080/v1
          apiKey: { env: LOCAL_LLM_API_KEY }
          # $/M tokens. Local inference costs nothing; priced as OpenRouter's
          # qwen/qwen3.8-flash (Alibaba endpoint) to show what it would cost.
          pricing:
            self-qwen3.8-flash-next:
              { input: 0.15, output: 0.47, cacheRead: 0.016, cacheWrite: 0.2 }
        embed:
          type: openai
          baseUrl: http://qwen3-embedding.ai.svc.cluster.local:8080/v1
          apiKey: { env: LOCAL_LLM_API_KEY }
      embedding:
        model: embed/qwen3-embedding
        dims: 1024
        # kritika gives each request 1 min (since 0.0.14) and the CPU
        # embedder does ~45k tokens/min, so 64 code chunks timed out.
        maxBatch: 16
        maxBatchChars: 48000
        # Global, not per repo. Measured top-5 neighbours vs random pairs:
        # home-ops (YAML) 28% of random pairs pass 0.5, 3% pass 0.7;
        similarFloor: 0.7
      review:
        model: modelrouter/self-qwen3.8-flash-next
        approve: true
        # low matched medium on every important finding in 300 eval runs,
        # with fewer steps and failed calls.
        effort: low
        agents:
          # No categories: replace the default pass for human PRs.
          # Keep Renovate on local Qwen, including user-authored bot branches.
          - name: human
            model: plan/~sol-latest
            fallback: modelrouter/self-qwen3.8-flash-next
            effort: high
            when:
              - name: human-pr
                expr: '!pr.bot && !pr.headRef.startsWith("renovate/")'
      confidence:
        model: plan/~sol-latest
        fallback: modelrouter/self-qwen3.8-flash-next
        threshold: 4
        # Instance ceiling; each repository's .kritika.yaml sets its own cap:
        # containers critical, agent-tools high, home-ops and bookarr medium.
        # Set a repository cap before enabling additional repositories.
        risk: critical
      agent:
        # Default is 20m; the review runner's deadline stretches to fit.
        timeout: 45m
        # Qwen finds the same issues with fewer steps.
        steps: 24
      limits:
        concurrency: 2
      trigger:
        exclude:
          - { name: forks, expr: pr.fork }
          # Release Please PRs collect already-reviewed changes.
          - name: release-please
            expr: 'pr.labels.exists(l, l.name == "autorelease: pending")'
      egress:
        allow:
          - "*"
          # Envoy's external gateway serves konflate over HTTPS. Kritika's
          # egress proxy requires an explicit allow for private addresses.
          - 192.168.10.23
        deny: ["*.internal"]

    envFrom:
      - secretRef:
          name: kritika-secret
    env:
      OIDC_CLIENT_SECRET:
        valueFrom:
          secretKeyRef:
            name: ${APP}-oidc-credentials
            key: client-secret

    resources:
      requests: { cpu: 10m, memory: 64Mi }
      limits: { memory: 512Mi }

    runner:
      admissionPolicy:
        enabled: true
      jobTemplate:
        spec:
          # Local models doing multi-step research outrun the 15m default.
          activeDeadlineSeconds: 1800
      podTemplate:
        spec:
          runtimeClassName: gvisor
          # Bounds the whole pod, including the run tool's commands.
          resources:
            requests: { cpu: 10m, memory: 256Mi }
            limits: { memory: 2Gi }
          containers:
            - name: runner
              env:
                - name: KONFLATE_URL
                  value: https://konflate.${SECRET_DOMAIN}
                - name: KONFLATE_HIDE_URL
                  value: "true"

    database:
      owner:
        existingSecret: kritika-postgres-credentials
      app:
        existingSecret: kritika-postgres-app
      runner:
        existingSecret: kritika-postgres-runner

    httpRoute:
      enabled: true
      parentRefs:
        - name: envoy-external
          namespace: network
          sectionName: https
      hostnames:
        - ${APP}.${SECRET_DOMAIN_1}

    networkPolicy:
      enabled: true
      # Keep standard Kubernetes policies; DNS names remain unfiltered.
      type: default
      postgres:
        podSelector:
          cnpg.io/cluster: kritika-postgres
      # 8080: modelrouter and the embedder in the ai namespace.
      # 10443: in-cluster *.${SECRET_DOMAIN} (e.g. Pocket ID) resolves to
      # the envoy LB, and Cilium enforces the backend port.
      egressPorts: [443, 8080, 10443]

    monitoring:
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          matchLabels:
            dashboards: grafana
      prometheusRule:
        enabled: true
        # One review worker with 45m agent timeouts means a second queued PR
        # waits longer than the chart's 600s default during normal load.
        queueAgeSeconds: 3600
        queueDelayFor: 30m
      serviceMonitor:
        enabled: true

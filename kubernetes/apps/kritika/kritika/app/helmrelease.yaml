---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kritika
spec:
  chartRef:
    kind: OCIRepository
    name: kritika
  interval: 1h
  values:
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"

    config:
      webUrl: https://${APP}.${SECRET_DOMAIN}
      runnerRuntimeClass: gvisor
      # Local models doing multi-step research outrun the 15m default.
      runnerDeadline: 30m
      reviewWorkers: 1

    # Passed through verbatim (no tpl); secrets are { env: NAME } from
    # envFrom/env below.
    configFile:
      auth:
        # Break-glass local admin; day-to-day sign-in is Pocket ID.
        admin:
          password: { env: ADMIN_PASSWORD }
        oidc:
          name: Pocket ID
          issuer: https://idm.${SECRET_DOMAIN}
          clientId: ${APP}
          clientSecret: { env: OIDC_CLIENT_SECRET }
          scopes: [openid, email, profile, groups]
          rolesClaim: groups
          roleMappingExpr: '"kritika-admins" in roles ? "admin" : ("kritika-users" in roles ? "member" : "")'
      apps:
        github:
          accounts: [Faustvii]
          clientId: { env: GITHUB_APP_CLIENT_ID }
          privateKey: { env: GITHUB_APP_PRIVATE_KEY }
          webhookSecret: { env: GITHUB_APP_WEBHOOK_SECRET }
      providers:
        modelrouter:
          type: openai
          baseUrl: http://modelrouter-router-proxy.ai.svc.cluster.local:8080/v1
          apiKey: { env: LOCAL_LLM_API_KEY }
        embed:
          type: openai
          baseUrl: http://qwen3-embedding.ai.svc.cluster.local:8080/v1
          apiKey: { env: LOCAL_LLM_API_KEY }
      defaults:
        models:
          review: modelrouter/self-qwen3.8
        limits:
          concurrency: 1
      embedding:
        model: embed/qwen3-embedding
        dims: 1024
        # Global, not per repo. Measured top-5 neighbours vs random pairs:
        # home-ops (YAML) 28% of random pairs pass 0.5, 3% pass 0.7;
        # bookarr keeps 93% of neighbours at 0.7.
        similarFloor: 0.7
      egress:
        allowHosts:
          - "*.githubusercontent.com"
          - ghcr.io
          - konflate.${SECRET_DOMAIN}
      # Per-repository rules and ignores live in each repo's .kritika.yaml;
      # agent may only be set here.
      repositories:
        Faustvii/*:
          agent:
            # The runner's -tools image provides these.
            commands: [gh, curl, jq, yq, rg, fd]
        # Here rather than in .kritika.yaml to keep the domain out of the repo;
        # rules add up by id with the repo's own.
        Faustvii/home-ops:
          rules:
            - id: konflate
              paths: ["kubernetes/**"]
              rule: >-
                konflate renders this pull request's Flux manifests at the
                head and the merge base and diffs the result, so it shows what
                the change does to the cluster that the git diff hides. Before
                reviewing, fetch its summary with
                `curl -sS --retry 10 -H "Accept: text/markdown"
                https://konflate.${SECRET_DOMAIN}/api/prs/<number>/summary`,
                with this pull request's number: the blast radius, caution
                lint (data loss, immutable fields, RBAC, suspend/prune), image
                changes and render failures. A 404 means konflate does not
                track the pull request; go on without it. For the rendered
                YAML, save
                `curl -sS -o konflate-diff.json
                https://konflate.${SECRET_DOMAIN}/api/prs/<number>/diff` and
                read it with jq: `.diff.resources[]` has `id`, `title`,
                `kind`, `name`, `status`, `add`, `del` and the `unified` diff
                rows. konflate already posts its summary on the pull request,
                so do not repeat its cautions or tables. Use what it rendered
                as evidence for your own findings: to judge what a change
                really does, to confirm or rule out a suspected problem, and
                to catch a rendered change the diff or description does not
                explain.

    envFrom:
      - secretRef:
          name: kritika-secret
    env:
      OIDC_CLIENT_SECRET:
        valueFrom:
          secretKeyRef:
            name: ${APP}-oidc-credentials
            key: client-secret

    database:
      owner:
        existingSecret: kritika-postgres-credentials
      app:
        existingSecret: kritika-postgres-app
      runner:
        existingSecret: kritika-postgres-runner

    httpRoute:
      enabled: true
      parentRefs:
        - name: envoy-external
          namespace: network
          sectionName: https
      hostnames:
        - ${APP}.${SECRET_DOMAIN}

    networkPolicy:
      enabled: true
      # 8080: modelrouter and the embedder in the ai namespace.
      # 10443: in-cluster *.${SECRET_DOMAIN} (e.g. Pocket ID) resolves to
      # the envoy LB, and Cilium enforces even standard NetworkPolicies on
      # the backend port.
      egressPorts: [443, 8080, 10443]

    monitoring:
      serviceMonitor:
        enabled: true

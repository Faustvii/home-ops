---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: shrieker-settings
    files:
      - coordinator.json=./resources/coordinator.json
generatorOptions:
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
  disableNameSuffixHash: true
resources:
  - ./helmrelease.yaml
  - ./networkpolicy.yaml
  - ./ocirepository.yaml

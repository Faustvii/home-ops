---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: truenas-external-service
  labels:
    kubernetes.io/service-name: truenas-external-service
addressType: IPv4
endpoints:
  - addresses:
      - ${NFS_SERVER_IP}
    conditions:
      ready: true
ports:
  - name: http
    port: 81
    protocol: TCP

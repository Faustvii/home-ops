---
# A Service without a selector; the EndpointSlice below points it at the device
apiVersion: v1
kind: Service
metadata:
  name: truenas-external-service
spec:
  ports:
    # TrueNAS WebSocket upgrades require HTTP/1.1 on the TLS upstream.
    - name: https
      appProtocol: kubernetes.io/wss
      port: 444
      protocol: TCP
      targetPort: 444
  type: ClusterIP

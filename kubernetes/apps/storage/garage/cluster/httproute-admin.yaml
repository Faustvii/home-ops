---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: garage-admin
  annotations:
    gatus.home-operations.com/enabled: "false"
spec:
  hostnames:
    - "garage.${SECRET_DOMAIN}"
  parentRefs:
    - name: envoy-internal
      namespace: network
  rules:
    - backendRefs:
        - name: garage
          port: 3903

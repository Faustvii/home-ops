apiVersion: garage.rajsingh.info/v1beta1
kind: GarageReferenceGrant
metadata:
  name: allow-default-access
  namespace: storage
spec:
  from:
    - kind: GarageKey
      namespace: kritika
    - kind: GarageBucket
      namespace: kritika

    - kind: GarageKey
      namespace: media
    - kind: GarageBucket
      namespace: media

    - kind: GarageKey
      namespace: media-management
    - kind: GarageBucket
      namespace: media-management

    - kind: GarageKey
      namespace: nextcloud
    - kind: GarageBucket
      namespace: nextcloud

    - kind: GarageKey
      namespace: observability
    - kind: GarageBucket
      namespace: observability

    - kind: GarageKey
      namespace: security
    - kind: GarageBucket
      namespace: security
  to:
    - kind: GarageCluster
      name: garage
---
# database/postgres and default/schemas adopt pre-existing buckets via spec.bucketId,
# which bucketScope Referenced (the default since v0.9.1) denies.
apiVersion: garage.rajsingh.info/v1beta1
kind: GarageReferenceGrant
metadata:
  name: allow-adopted-buckets
  namespace: storage
spec:
  from:
    - kind: GarageKey
      namespace: default
    - kind: GarageBucket
      namespace: default

    - kind: GarageKey
      namespace: database
    - kind: GarageBucket
      namespace: database
  to:
    - kind: GarageCluster
      name: garage
      bucketScope: Cluster

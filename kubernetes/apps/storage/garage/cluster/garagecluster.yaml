# yaml-language-server: $schema=https://raw.githubusercontent.com/rajsinghtech/garage-operator/refs/heads/main/schemas/garagecluster_v1beta2.json
apiVersion: garage.rajsingh.info/v1beta2
kind: GarageCluster
metadata:
  name: garage
spec:

  admin:
    adminTokenSecretRef:
      key: GARAGE_ADMIN_TOKEN
      name: garage-cluster
    bindPort: 3903
  image: dxflrs/garage:v2.3.0

  layoutManagement:
    autoApply: true
    minNodesHealthy: 2 # Wait for 2/2 nodes before applying layout

  monitoring:
    enabled: true

  network:
    rpcBindPort: 3901
    # Shared RPC secret - MUST be same across all clusters
    rpcSecretRef:
      key: GARAGE_RPC_SECRET
      name: garage-cluster
    service:
      type: ClusterIP

  # How remote clusters reach this cluster's nodes
  publicEndpoint:
    loadBalancer:
      perNode: true
    type: LoadBalancer

  # Remote clusters in other K8s clusters
  # Nodes are auto-discovered via Admin API
  remoteClusters:
    - connection:
        adminApiEndpoint: "http://truenas.faust:30190"
      name: garage-eu
      zone: eu-west-2

  replication:
    consistencyMode: degraded
    factor: 2
    zoneRedundancyMode: "Maximum"

  s3Api:
    bindPort: 3900
    region: garage
    rootDomain: .s3.garage.${SECRET_DOMAIN:=cluster.local}

  storage:
    data:
      size: 300Gi
      storageClassName: miroir-local
    metadata:
      size: 10Gi
      storageClassName: miroir-local
    replicas: 2
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule

  webApi:
    bindPort: 3902
    rootDomain: .web.garage.${SECRET_DOMAIN:=cluster.local}

  # Zone for this cluster - used for fault tolerance
  zone: eu-west-1

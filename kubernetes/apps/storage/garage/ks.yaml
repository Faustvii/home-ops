---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app garage-operator
  namespace: &namespace storage
spec:
  interval: 1h
  path: ./kubernetes/apps/storage/garage/operator
  postBuild:
    substitute:
      APP: *app
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  wait: true
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app garage-cluster
  namespace: &namespace storage
spec:
  dependsOn:
    - name: garage-operator
  healthCheckExprs:
    - apiVersion: garage.rajsingh.info/v1beta2
      kind: GarageCluster
      current: has(status.phase) && status.phase == 'Running' && has(status.health) && status.health.healthy == true && status.health.status == 'healthy'
      inProgress: "!has(status.phase) || status.phase != 'Running' || !has(status.health) || status.health.healthy != true || status.health.status != 'healthy'"
  healthChecks:
    - apiVersion: garage.rajsingh.info/v1beta2
      kind: GarageCluster
      name: garage
      namespace: storage
  interval: 1h
  path: ./kubernetes/apps/storage/garage/cluster
  postBuild:
    substitute:
      APP: *app
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  wait: true # gate readiness on GarageCluster health
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app garage-webui
  namespace: &namespace storage
spec:
  dependsOn:
    - name: garage-cluster
  interval: 1h
  path: ./kubernetes/apps/storage/garage/webui
  postBuild:
    substitute:
      APP: *app
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  wait: false # no flux ks dependents

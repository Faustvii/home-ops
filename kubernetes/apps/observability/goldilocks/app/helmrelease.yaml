---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: goldilocks
spec:
  interval: 1h
  chart:
    spec:
      chart: goldilocks
      version: 10.5.0
      sourceRef:
        kind: HelmRepository
        name: fairwinds-goldilocks
  values:
    image:
      repository: us-docker.pkg.dev/fairwinds-ops/oss/goldilocks
      tag: v4.16.1@sha256:e805dd99f64a74c4751458c13713c8b773684a14b10df529b56f8009732ab044
    controller:
      enabled: true
      includedNamespaces:
        - observability
        - default
        - media
        - database
        - matrix

    dashboard:
      enabled: true
      service:
        type: ClusterIP
        port: 8080

    vpa:
      enabled: false

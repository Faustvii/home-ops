---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/grafana.integreatly.org/grafanadatasource_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: prometheus
spec:
  datasource:
    access: proxy
    isDefault: true
    name: prometheus
    type: prometheus
    uid: prometheus
    url: http://vmsingle-vmks.observability.svc.cluster.local:8428
  instanceSelector:
    matchLabels:
      dashboards: grafana
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/grafana.integreatly.org/grafanadatasource_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: alertmanager
spec:
  datasource:
    access: proxy
    jsonData:
      implementation: prometheus
    name: alertmanager
    type: alertmanager
    url: http://vmalertmanager-vmks.observability.svc.cluster.local:9093
  instanceSelector:
    matchLabels:
      dashboards: grafana

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/aclerici38/pocket-id-operator/main/dist/schemas/pocketidoidcclient_v1alpha1.json
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: grafana
spec:
  allowedUserGroups:
    - name: grafana-users
    - name: grafana-admin-users
  callbackUrls:
    - https://grafana.${SECRET_DOMAIN}/login/generic_oauth
  launchUrl: https://grafana.${SECRET_DOMAIN}
  name: Grafana
  pkceEnabled: true
  secret:
    keys:
      clientID: client-id
      clientSecret: client-secret
    name: grafana-oidc-credentials

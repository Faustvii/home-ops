---
# yaml-language-server: $schema=https://raw.githubusercontent.com/aclerici38/pocket-id-operator/main/dist/schemas/pocketidoidcclient_v1alpha1.json
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: speedtest-tracker
spec:
  allowedUserGroups:
    - name: speedtest-tracker-users
  callbackUrls:
    - https://speedtest.${SECRET_DOMAIN_1}/oauth2/callback
  launchUrl: https://speedtest.${SECRET_DOMAIN_1}
  logoutCallbackUrls:
    - https://speedtest.${SECRET_DOMAIN_1}/
  name: Speedtest Tracker
  pkceEnabled: false
  secret:
    keys:
      clientID: client-id
      clientSecret: client-secret
    name: speedtest-tracker-oidc-credentials

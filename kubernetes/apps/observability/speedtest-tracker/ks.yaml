---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app speedtest-tracker
  namespace: &namespace observability
spec:
  components:
    - ../../../../components/database/postgres/standalone
    - ../../../../components/database/dragonfly
  dependsOn:
    - name: pocket-id
      namespace: security
  interval: 1h
  path: ./kubernetes/apps/observability/speedtest-tracker/app
  postBuild:
    substitute:
      APP: *app
      DATABASE_STORAGE: 5Gi
      NAMESPACE: *namespace
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/source.toolkit.fluxcd.io/helmrepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: opentelemetry
spec:
  interval: 1h
  url: https://open-telemetry.github.io/opentelemetry-helm-charts
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app opentelemetry-operator
spec:
  chart:
    spec:
      chart: *app
      sourceRef:
        kind: HelmRepository
        name: opentelemetry
      version: 0.123.1
  interval: 1h
  values:
    manager:
      featureGatesMap:
        # Cilium ipBlock selectors don't match node identities, so the
        # operator's self-NetworkPolicy (egress to apiserver node IPs only)
        # blackholes all traffic to the kubernetes service. Enable only if
        # cilium runs with policyCIDRMatchMode=nodes.
        operator.networkpolicy: false

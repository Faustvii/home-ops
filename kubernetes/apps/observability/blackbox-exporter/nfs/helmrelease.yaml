---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blackbox-exporter-nfs
spec:
  chartRef:
    kind: OCIRepository
    name: blackbox-exporter-nfs
  interval: 1h
  values:
    config:
      modules:
        http_2xx:
          http:
            follow_redirects: true
            preferred_ip_protocol: ip4
            valid_http_versions:
              - HTTP/1.1
              - HTTP/2.0
          prober: http
          timeout: 5s
        icmp:
          icmp:
            preferred_ip_protocol: ip4
          prober: icmp
          timeout: 5s
        tcp_connect:
          prober: tcp
          tcp:
            preferred_ip_protocol: ip4
          timeout: 5s
    fullnameOverride: blackbox-exporter-nfs
    prometheusRule:
      enabled: true
      rules:
        - alert: NfsProbeFailed
          annotations:
            summary: |-
              The probe targeting {{ $labels.instance }} is currently having connectivity issues
          expr: |-
            probe_success{service="blackbox-exporter-nfs"} == 0
          for: 15m
          labels:
            severity: critical
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 50m
        memory: 64Mi
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
    serviceMonitor:
      enabled: true
      selfMonitor:
        enabled: true

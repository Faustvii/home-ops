---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blackbox-exporter-vpn
spec:
  chartRef:
    kind: OCIRepository
    name: blackbox-exporter-vpn
  interval: 1h
  postRenderers:
    - kustomize:
        patches:
          - patch: |-
              - op: remove
                path: /spec/strategy/rollingUpdate
            target:
              kind: Deployment
              name: blackbox-exporter-vpn
  values:
    config:
      modules:
        http_2xx:
          http:
            follow_redirects: true
            preferred_ip_protocol: ip4
            valid_http_versions:
              - HTTP/1.1
              - HTTP/2.0
          prober: http
          timeout: 5s
        icmp:
          icmp:
            preferred_ip_protocol: ip4
          prober: icmp
          timeout: 5s
        tcp_connect:
          prober: tcp
          tcp:
            preferred_ip_protocol: ip4
          timeout: 5s
    fullnameOverride: blackbox-exporter-vpn
    podAnnotations:
      k8s.v1.cni.cncf.io/networks: |-
        [{
          "name": "vpn",
          "namespace": "network",
          "ips": ["192.168.90.13/24"],
          "mac": "3e:d0:83:c0:8e:13"
        }]
    prometheusRule:
      enabled: true
      rules:
        - alert: VpnProbeFailed
          annotations:
            summary: |-
              The probe targeting {{ $labels.instance }} is currently having connectivity issues
          expr: |-
            probe_success{service="blackbox-exporter-vpn"} == 0
          for: 15m
          labels:
            severity: critical
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
    serviceMonitor:
      enabled: true
      selfMonitor:
        enabled: true
    strategy:
      type: Recreate

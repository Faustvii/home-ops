---
connectivity:
  checker:
    interval: 1m
    target: 1.1.1.1:53
debug: false

endpoints:
  - conditions:
      - "[CONNECTED] == true"
    group: connectivity
    interval: 1m
    name: Cloudflare
    url: icmp://1.1.1.1

  - conditions:
      - "[CONNECTED] == true"
    group: connectivity
    interval: 1m
    name: Google
    url: icmp://8.8.8.8

  - conditions:
      - "[CONNECTED] == true"
    group: connectivity
    interval: 1m
    name: Quad9
    url: icmp://9.9.9.9

metrics: true

storage:
  caching: true
  path: ${GATUS_CONFIG_PATH}/gatus.db
  type: sqlite

ui:
  buttons:
    - link: https://github.com/faustvii
      name: Github
    - link: https://github.com/faustvii/home-ops
      name: Homelab
  header: Status
  link: https://github.com/faustvii
  logo: https://avatars.githubusercontent.com/u/4357216
  title: Status | Gatus

web:
  port: ${GATUS_WEB_PORT}

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/alertmanagerconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: alertmanager
spec:
  inhibitRules:
    - equal:
        - alertname
        - namespace
      sourceMatch:
        - matchType: =
          name: severity
          value: critical
      targetMatch:
        - matchType: =
          name: severity
          value: warning

  receivers:
    - name: blackhole
    - discordConfigs:
        - apiURL:
            key: discord_general_webhook_url
            name: alertmanager-secret
          username: Talos
      name: discord-general
    - discordConfigs:
        - apiURL:
            key: discord_flux_webhook_url
            name: alertmanager-secret
          username: Flux
      name: discord-flux
  route:
    groupBy:
      - alertname
      - cluster
      - job
    receiver: blackhole
    repeatInterval: 12h
    routes:
      - matchers:
          - matchType: =
            name: alertname
            value: InfoInhibitor
        receiver: blackhole
      - matchers:
          - matchType: =
            name: severity
            value: error
        receiver: discord-general

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: vm-k8s-stack
spec:
  interval: 5m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 0.96.0
  url: oci://ghcr.io/victoriametrics/helm-charts/victoria-metrics-k8s-stack
  verify:
    matchOIDCIdentity:
      - issuer: "^https://token.actions.githubusercontent.com$"
        subject: "^https://github.com/VictoriaMetrics/helm-charts.*$"
    provider: cosign
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vmks
spec:
  chartRef:
    kind: OCIRepository
    name: vm-k8s-stack
  dependsOn:
    - name: victoria-metrics-operator
  interval: 1h
  values:
    alertmanager:
      enabled: true
      route:
        enabled: true
        hostnames: ["alertmanager.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
      spec:
        disableNamespaceMatcher: true
        externalURL: https://alertmanager.${SECRET_DOMAIN}
        storage:
          volumeClaimTemplate:
            spec:
              resources:
                requests:
                  storage: 1Gi
    crds:
      enabled: false
    defaultDashboards:
      enabled: false
      grafanaOperator:
        enabled: true
        spec:
          instanceSelector:
            matchLabels:
              dashboards: grafana
    defaultDatasources:
      grafanaOperator:
        enabled: false
    defaultRules:
      create: true
      rules:
        "count:up0":
          enabled: false
        # Replaced by node-memory-rules below (ZFS ARC aware)
        NodeMemoryHighUtilization:
          enabled: false
    extraRules:
      dockerhub-rules:
        groups:
          - name: dockerhub
            rules:
              - alert: DockerhubRateLimitRisk
                annotations:
                  summary: Kubernetes cluster Dockerhub rate limit risk
                expr: count(time() - container_last_seen{image=~"(docker.io).*",container!=""} < 30) > 100
                labels:
                  severity: critical
      # The default rule counts the ZFS ARC as used, so TrueNAS sits at ~96%.
      # Count ARC above its minimum (zfs_arc_min) as available. Nodes without
      # ZFS metrics get 0 added and keep the default calculation.
      node-memory-rules:
        groups:
          - name: node-memory
            rules:
              - record: instance:node_memory_used_excluding_arc:percent
                expr: |
                  100 - (
                    (
                      sum by (instance, job) (node_memory_MemAvailable_bytes{job="node-exporter"})
                      + (
                        sum by (instance, job) (clamp_min(node_zfs_arc_size{job="node-exporter"} - node_zfs_arc_c_min{job="node-exporter"}, 0))
                        or sum by (instance, job) (node_memory_MemTotal_bytes{job="node-exporter"}) * 0
                      )
                    )
                    / sum by (instance, job) (node_memory_MemTotal_bytes{job="node-exporter"}) * 100
                  )
              - alert: NodeMemoryHighUtilization
                annotations:
                  description: |
                    Memory is filling up at {{ $labels.instance }}, has been above 90% for the last 15 minutes, is currently at {{ printf "%.2f" $value }}%.
                  runbook_url: https://runbooks.prometheus-operator.dev/runbooks/node/nodememoryhighutilization
                  summary: Host is running out of memory.
                expr: instance:node_memory_used_excluding_arc:percent{instance!="192.168.10.13:9100"} > 90
                for: 15m
                labels:
                  severity: warning
              # talos-04 (192.168.10.13) runs at ~91% by design: the LLM models
              # hold their memory. Alert only when the last ~3.7 GiB are in use.
              - alert: NodeMemoryHighUtilization
                annotations:
                  description: |
                    Memory is filling up at {{ $labels.instance }}, has been above 97% for the last 15 minutes, is currently at {{ printf "%.2f" $value }}%.
                  runbook_url: https://runbooks.prometheus-operator.dev/runbooks/node/nodememoryhighutilization
                  summary: Host is running out of memory.
                expr: instance:node_memory_used_excluding_arc:percent{instance="192.168.10.13:9100"} > 97
                for: 15m
                labels:
                  severity: warning
      oom-rules:
        groups:
          - name: oom
            rules:
              - alert: OomKilled
                annotations:
                  summary: Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} has been OOMKilled {{ $value }} times in the last 10 minutes.
                expr: (kube_pod_container_status_restarts_total - kube_pod_container_status_restarts_total offset 10m >= 1) and ignoring (reason) min_over_time(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[10m]) == 1
                labels:
                  severity: critical
    global:
      cluster:
        dnsDomain: cluster.local.
    grafana:
      enabled: false
    kube-state-metrics:
      enabled: true
      fullnameOverride: kube-state-metrics
    kubeApiServer:
      enabled: true
    kubeControllerManager:
      vmScrape:
        spec:
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              port: http-metrics
              scheme: https
              tlsConfig:
                insecureSkipVerify: true
    kubeEtcd:
      service:
        port: 2381
        selector:
          component: kube-apiserver
        targetPort: 2381
      vmScrape:
        spec:
          endpoints:
            - port: http-metrics
              scheme: http
    kubeScheduler:
      vmScrape:
        spec:
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              port: http-metrics
              scheme: https
              tlsConfig:
                insecureSkipVerify: true
    kubelet:
      vmScrape:
        spec:
          relabelConfigs:
            # This is the same as the chart default, but it explicitly excludes NFD node labels,
            # and talos extension labels, and some others. These don't really provide any value,
            # and they cause cardinality to explode.
            - action: labelmap
              regex: __meta_kubernetes_node_label_(.+)
            - action: labeldrop
              regex: (feature_node|extensions_talos_dev|beta_kubernetes|plan_upgrade_cattle_io|openebs_io|katacontainers_io|topology_rook_io_).*
            - action: labeldrop
              regex: .*kubevirt_io.*
            - action: labeldrop
              regex: .*home_arpa.*
            - sourceLabels: [__metrics_path__]
              targetLabel: metrics_path
            - replacement: kubelet
              targetLabel: job
      vmScrapes:
        kubelet:
          enabled: true
    nameOverride: vmks
    prometheus-node-exporter:
      enabled: true
    victoria-metrics-operator:
      enabled: false
    vmagent:
      spec:
        extraArgs:
          promscrape.maxScrapeSize: "32MB"
          promscrape.streamParse: "true"
        globalScrapeMetricRelabelConfigs: &relabel-config
          - action: labeldrop
            regex: ((?:extensions_talos|feature_node).*)
        inlineRelabelConfig: *relabel-config
        resources:
          limits:
            cpu: 1
            memory: 1Gi
          requests:
            cpu: 150m
        scrapeInterval: 20s
        selectAllByDefault: true
    vmalert:
      enabled: true
    vmsingle:
      route:
        enabled: true
        hostnames: ["vmsingle.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
      spec:
        extraArgs:
          maxLabelsPerTimeseries: "40"
          opentelemetry.usePrometheusNaming: "true"
          search.maxUniqueTimeseries: "600000"
          search.minStalenessInterval: 5m
        replicaCount: 1
        resources:
          limits:
            memory: 2Gi
          requests:
            cpu: 100m
        retentionPeriod: 14d
        storage:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 50Gi
        useDefaultResources: false
        useStrictSecurity: true

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: leaderboard-preview
spec:
  chartRef:
    kind: OCIRepository
    name: leaderboard-preview
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      topologySpreadConstraints:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/controller: leaderboard-preview
              app.kubernetes.io/instance: leaderboard-preview
              app.kubernetes.io/name: leaderboard-preview
          maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
    controllers:
      leaderboard-preview:
        annotations:
          reloader.stakater.com/auto: "true"
        replicas: 1
        rollingUpdate:
          maxSurge: 1
          maxUnavailable: 0
        strategy: RollingUpdate
        containers:
          app:
            image:
              repository: ghcr.io/faustvii/beth-leaderboard
              tag: pr-latest@sha256:d48aee00a02a3172563bc84100b508121f458db7d00794a5a1faaa365f5eed04
            env:
              DATABASE_CONNECTION_TYPE: local
              HOST_URL: https://leaderboard-preview.${SECRET_DOMAIN}
              IS_CHRISTMAS: "true"
              LOG_LEVEL: debug
              NODE_ENV: preprod
              TZ: ${TZ}
            envFrom:
              - secretRef:
                  name: leaderboard-preview-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  failureThreshold: 5
                  httpGet:
                    path: /static/styles.css
                    port: &port 3000
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  failureThreshold: 3
                  httpGet:
                    path: /static/styles.css
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
              startup:
                enabled: true
                custom: true
                spec:
                  failureThreshold: 30
                  httpGet:
                    path: /static/styles.css
                    port: *port
                  periodSeconds: 5
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true
    persistence:
      cache:
        type: emptyDir
        advancedMounts:
          leaderboard-preview:
            app:
              - path: /usr/src/app/data
                subPath: data
              - path: /usr/src/app/public/user
                subPath: user
              - path: /tmp
                subPath: tmp
        sizeLimit: 1Gi
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-external
            namespace: network
    service:
      app:
        ports:
          http:
            port: *port

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: leaderboard
spec:
  chartRef:
    kind: OCIRepository
    name: leaderboard
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      topologySpreadConstraints:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/controller: leaderboard
              app.kubernetes.io/instance: leaderboard
              app.kubernetes.io/name: leaderboard
          maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
    controllers:
      leaderboard:
        annotations:
          reloader.stakater.com/auto: "true"
        replicas: 2
        rollingUpdate:
          maxSurge: 1
          maxUnavailable: 0
        strategy: RollingUpdate
        containers:
          app:
            image:
              repository: ghcr.io/faustvii/beth-leaderboard
              tag: latest@sha256:6f30c04601910be84ea2f772a1b3530b2db0d2ff42460e8b909f8f42c948d95b
            env:
              DATABASE_CONNECTION_TYPE: local-replica
              HOST_URL: https://leaderboard.${SECRET_DOMAIN_1}
              LOG_LEVEL: info
              NODE_ENV: production
              TZ: ${TZ}
            envFrom:
              - secretRef:
                  name: leaderboard-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  failureThreshold: 5
                  httpGet:
                    path: /static/styles.css
                    port: &port 3000
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  failureThreshold: 3
                  httpGet:
                    path: /static/styles.css
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
              startup:
                enabled: true
                custom: true
                spec:
                  failureThreshold: 30
                  httpGet:
                    path: /static/styles.css
                    port: *port
                  periodSeconds: 5
            resources:
              requests:
                cpu: 50m
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true
    persistence:
      cache:
        type: emptyDir
        advancedMounts:
          leaderboard:
            app:
              - path: /usr/src/app/data
                subPath: data
              - path: /usr/src/app/public/user
                subPath: user
              - path: /tmp
                subPath: tmp
        sizeLimit: 1Gi
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN_1}"
        parentRefs:
          - name: envoy-external
            namespace: network
    service:
      app:
        ports:
          http:
            port: *port

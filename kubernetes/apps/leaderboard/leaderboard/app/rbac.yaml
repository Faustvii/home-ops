---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: leaderboard-image-applier
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: leaderboard-image-applier
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: leaderboard-image-applier
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: leaderboard-image-applier
subjects:
  - kind: ServiceAccount
    name: leaderboard-image-applier
    namespace: leaderboard

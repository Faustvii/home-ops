---
# Open PRs on beth-leaderboard with the `preview` label.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSetInputProvider
metadata:
  name: leaderboard-github-prs
  annotations:
    fluxcd.controlplane.io/reconcileEvery: 1h
spec:
  filter:
    labels:
      - preview
    limit: 10
  skip:
    labels:
      - preview-pause
  secretRef:
    name: github-auth
  type: GitHubPullRequest
  url: https://github.com/faustvii/beth-leaderboard
# Sample input for offline rendering (flate). Status is dropped on apply.
status:
  exportedInputs:
    - author: example
      branch: example-pr
      id: "1"
      sha: "latest@sha256:ec44e4ac9dde09940c2fc34cfd865f8bbd8ac1efed92ef06e0e33b49c958813b"
      title: Example PR

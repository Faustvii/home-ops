---
# Sticky PR comment with the preview's deploy status.
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: leaderboard-preview-pr-comment
spec:
  address: https://github.com/faustvii/beth-leaderboard
  secretRef:
    name: github-auth
  type: githubpullrequestcomment
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: leaderboard-preview-pr-comment
spec:
  eventSeverity: info
  eventSources:
    - kind: HelmRelease
      # Names match literally (only "*" is a wildcard), so select by label.
      name: "*"
      namespace: leaderboard-previews
      matchLabels:
        event.toolkit.fluxcd.io/helmrelease: leaderboard-preview
  providerRef:
    name: leaderboard-preview-pr-comment

---
# GitHub App credentials in the key layout Flux reads (fluxcd/pkg/auth/githubapp).
# The App is installed on beth-leaderboard only. Do not add a `token` key: the
# notifier prefers it over App auth.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-auth

spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: github-auth
    template:
      data:
        githubAppID: "{{ .GITHUB_APP_ID }}"
        githubAppInstallationID: "{{ .GITHUB_APP_INSTALLATION_ID }}"
        githubAppPrivateKey: "{{ .GITHUB_APP_PRIVATE_KEY }}"
      engineVersion: v2
      type: Opaque
  dataFrom:
    - find:
        path: /leaderboard

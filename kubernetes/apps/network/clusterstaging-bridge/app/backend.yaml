---
apiVersion: v1
kind: Service
metadata:
  name: clusterstaging-nginx-external
spec:
  ports:
    - name: https
      port: 443
      protocol: TCP
      targetPort: 443
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: clusterstaging-nginx-external
  labels:
    endpointslice.kubernetes.io/managed-by: flux
    kubernetes.io/service-name: clusterstaging-nginx-external
addressType: IPv4
endpoints:
  - addresses: ["192.168.1.71"]
ports:
  - name: https
    port: 443
    protocol: TCP
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/backendtlspolicy_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: clusterstaging-nginx-external
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: clusterstaging-nginx-external
      sectionName: https
  validation:
    hostname: "${SECRET_DOMAIN}"
    wellKnownCACertificates: System

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
# Public entry for the old zone. nginx-external only knows its external-class hosts,
# so internal-only apps answer 404 here. Hostnames already on home-ops win.
# Hidden from k8s-gateway so LAN DNS falls through to the old cluster's dns.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: clusterstaging-external
  annotations:
    gatus.home-operations.com/enabled: "false"
  labels:
    k8s-gateway.dns/ignore: "true"
spec:
  hostnames:
    - "${SECRET_DOMAIN_1}"
    - "*.${SECRET_DOMAIN_1}"
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: clusterstaging-nginx-external
          port: 443

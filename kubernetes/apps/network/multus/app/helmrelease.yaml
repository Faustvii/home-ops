---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: multus
spec:
  chartRef:
    kind: OCIRepository
    name: multus
  interval: 1h
  postRenderers:
    - kustomize:
        patches:
          # The chart only tolerates CriticalAddonsOnly. talos-03 is tainted
          # dedicated=talos-03, so without this Multus does not run there and
          # pods pinned to it start without their secondary (vpn) network.
          - patch: |
              - op: add
                path: /spec/template/spec/tolerations/-
                value:
                  effect: NoSchedule
                  key: dedicated
                  operator: Equal
                  value: talos-03
            target:
              kind: DaemonSet
              name: multus
  values:
    cni:
      binPath: /opt/cni/bin
      netPath: /etc/cni/net.d
    multus:
      resources:
        limits:
          memory: 512Mi
        requests:
          cpu: 10m

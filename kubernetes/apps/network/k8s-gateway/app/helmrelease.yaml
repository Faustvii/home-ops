---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-gateway
spec:
  chartRef:
    kind: OCIRepository
    name: k8s-gateway
  interval: 1h
  values:
    domain: "${SECRET_DOMAIN}"
    fullnameOverride: k8s-gateway
    service:
      annotations:
        lbipam.cilium.io/ips: "192.168.10.21"
      externalTrafficPolicy: Cluster
      port: 53
      type: LoadBalancer
    ttl: 1
    watchedResources: ["HTTPRoute", "Service"]

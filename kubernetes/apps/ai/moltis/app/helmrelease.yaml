---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app moltis
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
    controllers:
      *app :
        type: statefulset

        initContainers:
          daemon:
            image:
              repository: docker
              tag: 29.7.2-dind@sha256:3ef33f2e220b79ed3ef3b99d81746f06f306cd6340e2cb7331d17ae996e74cb6
            env:
              - name: DOCKER_TLS_CERTDIR
                value: /certs
            probes:
              startup:
                enabled: true
                custom: true
                spec: &probeSpec
                  exec:
                    command: ["docker", "info"]
                  failureThreshold: 60
                  periodSeconds: 2
                  timeoutSeconds: 3

              readiness:
                enabled: true
                custom: true
                spec:
                  <<: *probeSpec
                  failureThreshold: 3
                  periodSeconds: 5
                  timeoutSeconds: 3

              liveness:
                enabled: true
                custom: true
                spec:
                  <<: *probeSpec
                  failureThreshold: 3
                  periodSeconds: 20
                  timeoutSeconds: 3
            restartPolicy: Always
            securityContext:
              allowPrivilegeEscalation: true
              privileged: true
              runAsGroup: 0
              runAsNonRoot: false
              runAsUser: 0

        containers:
          app:
            image:
              repository: ghcr.io/moltis-org/moltis
              tag: latest@sha256:56a9aa3305c480987f16da4f1a464a3ef328de03ec69562c3fc327a029681a87
            args:
              - --bind
              - "::"
              - --port
              - "13131"
              - --no-tls
            env:
              DOCKER_CERT_PATH: /certs/client

              DOCKER_HOST: tcp://localhost:2376
              DOCKER_TLS_VERIFY: "1"
              MOLTIS_BEHIND_PROXY: true

              MOLTIS_CONFIG_DIR: /config
              MOLTIS_DATA_DIR: /data

              MOLTIS_NO_TLS: true
              MOLTIS_WEBAUTHN_ORIGIN: "https://{{ .Release.Name }}.${SECRET_DOMAIN}"

              MOLTIS_WEBAUTHN_RP_ID: "{{ .Release.Name }}.${SECRET_DOMAIN}"
              TZ: "${TZ}"
            envFrom:
              - secretRef:
                  name: *app
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  failureThreshold: 3
                  httpGet:
                    path: /health
                    port: &port 13131
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 10
              readiness: *probe
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true

    persistence:
      data:
        existingClaim: *app
        globalMounts:
          - path: /config
            subPath: config
          - path: /data
            subPath: data

      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /certs
            subPath: certs
          - path: /home/moltis/.docker
            subPath: home
          - path: /tmp
            subPath: tmp

    route:
      main:
        hostnames: ["{{ .Release.Name }}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 80

    service:
      app:
        controller: *app
        ports:
          http:
            port: 80
            targetPort: *port

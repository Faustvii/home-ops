---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/model_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: qwen3-embedding-0.6b
spec:
  files:
    - Qwen3-Embedding-0.6B-Q8_0.gguf
  format: gguf
  hardware:
    accelerator: cpu
  quantization: Q8_0
  source: hf://Qwen/Qwen3-Embedding-0.6B-GGUF
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/inferenceservice_v1alpha1.json
# CPU-only embedder for kritika's similar-code index (1024 dims). Called
# directly, not through modelrouter, which only proxies chat completions.
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: qwen3-embedding
spec:
  mode: embedding
  # With --pooling last a long input is split across ubatches through the
  # KV cache (llama.cpp can_split), so the ubatch can stay small; attention
  # scratch grows with its square (8192 OOMed past 6Gi on one 6.6k-token
  # input). No batchSize: embeddings force n_batch = n_ubatch.
  uBatchSize: 512
  # KV is ~112 KiB/token (f16), so 32768 ctx is ~3.5 GiB, shared by the 4
  # slots through the unified KV; an input must fit what is free of it.
  contextSize: 32768
  parallelSlots: 4
  endpoint:
    port: 8080
    type: ClusterIP
  extraArgs:
    # Without FA the attention scores alone are 16 heads x ubatch x ctx x
    # 4 B (~8 GiB at 8192 x 16384), filled lazily until the pod OOMs.
    # Set here: llmkube 0.9.29 drops spec.flashAttention without a GPU.
    - --flash-attn
    - "on"
    - --alias
    - qwen3-embedding
    - --cont-batching
    - --kv-unified
    - --cache-ram
    - "0"
    - --threads
    - "4"
    - --threads-batch
    - "8"
    - --load-mode
    - mmap
  image: ghcr.io/ggml-org/llama.cpp:server-b10548@sha256:4edd7ad571186256b3b9a4b6386f515b8725f78c34828131a5c85d2a0676e241
  modelCache:
    claimName: llmkube-embedding-cache
  modelRef: qwen3-embedding-0.6b
  priority: normal
  probeOverrides:
    liveness:
      failureThreshold: 6
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 30
    readiness:
      failureThreshold: 6
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 20
      periodSeconds: 10
    startup:
      failureThreshold: 360
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
  replicas: 1
  resources:
    cpu: "2"
    memory: 8Gi
  rolloutPolicy:
    idleTimeoutSeconds: 86400
    waitForIdle: true
  runtime: llamacpp

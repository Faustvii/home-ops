---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/model_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: qwen3-8b
spec:
  files:
    - Qwen3-8B-UD-Q8_K_XL.gguf
  format: gguf
  hardware:
    accelerator: rocm
    gpu:
      enabled: true
      layers: -1
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: llm-amd-gpu
      vendor: amd
  quantization: UD-Q8_K_XL
  source: hf://unsloth/Qwen3-8B-GGUF
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/inferenceservice_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: qwen3-8b-strix
spec:
  batchSize: 2048
  cacheTypeK: q8_0
  cacheTypeV: q8_0
  command:
    - llama-server
  # Qwen3 natively supports 32K; HA Assist rarely needs more than a handful
  # of turns + ~30 exposed entities (~1-2K tokens), so no need for the 256K
  # context or aggressive KV budget the 35B reasoning model uses.
  contextSize: 32768
  endpoint:
    port: 8080
    type: ClusterIP
  extraArgs:
    - --alias
    - qwen3-8b
    - --cont-batching
    - --cache-prompt
    - --kv-unified
    - --reasoning
    - "off"
    # Qwen's own recommended sampler settings for non-thinking mode.
    - --temp
    - "0.7"
    - --top-p
    - "0.8"
    - --top-k
    - "20"
    - --min-p
    - "0"
    - --repeat-penalty
    - "1.05"
    - --threads
    - "8"
    - --threads-batch
    - "12"
    - --load-mode
    - none
  flashAttention: true
  image: docker.io/kyuz0/amd-strix-halo-toolboxes:rocm-6.4.4@sha256:7dff493b27b6e5c9826cef548dc5c7fff8b1544a2e800c74d755c60180629981
  jinja: true
  modelCache:
    claimName: llmkube-strix-cache
  modelRef: qwen3-8b
  nodeSelector:
    kubernetes.io/hostname: talos-04
    topology.kubernetes.io/gpus: amd
  parallelSlots: 4
  priority: high
  probeOverrides:
    liveness:
      failureThreshold: 6
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 15
      periodSeconds: 30
    readiness:
      failureThreshold: 6
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 10
      periodSeconds: 10
    startup:
      failureThreshold: 60
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 5
  # Voice control should not "think" — thinking mode is too slow for a
  # sub-2-second response budget. Cap reasoning hard near zero rather than
  # the 16384 budget used for the coding/reasoning model.
  reasoningBudget: 0
  reasoningBudgetMessage: "Answer directly without reasoning."
  replicas: 1
  resources:
    cpu: "250m"
    memory: 12Gi
  rolloutPolicy:
    # This is the voice-control agent — it needs to be resident, not swapped
    # out on idle like the 35B reasoning model. Voice commands can't eat a
    # cold-start penalty waiting for the pool to page it back in.
    waitForIdle: false
  runtime: llamacpp
  tolerations:
    - effect: NoSchedule
      key: llm-workload
      operator: Exists
  uBatchSize: 512

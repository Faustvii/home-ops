---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/model_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: qwen3.8-27b
spec:
  # Dense 27B (all params active) — heavier than the 35B-A3B MoE.
  # UD-Q6_K_XL is a size/quality balance; bump to UD-Q8_K_XL for max
  # quality if VRAM allows, or drop to UD-Q4_K_XL to shrink.
  files:
    - Qwen3.8-27B-UD-Q6_K_XL.gguf
  format: gguf
  hardware:
    accelerator: rocm
    gpu:
      enabled: true
      layers: -1
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: llm-amd-gpu
      vendor: amd
  # Vision/multimodal projector — enables image input.
  mmproj: mmproj-F16.gguf
  quantization: UD-Q6_K_XL
  source: hf://unsloth/Qwen3.8-27B-GGUF
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/inferenceservice_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: qwen3.8-27b-strix
spec:
  batchSize: 2048
  cacheTypeK: q8_0
  cacheTypeV: q8_0
  command:
    - llama-server
  # Native 262144, but dense-27B KV is expensive; 131072 keeps memory
  # sane. Raise toward 262144 only if the VRAM budget allows.
  contextSize: 131072
  endpoint:
    port: 8080
    type: ClusterIP
  extraArgs:
    - --alias
    - qwen3.8-27b-strix
    - --image-min-tokens
    - "1024"
    - --cont-batching
    - --spec-type
    - draft-mtp
    - --spec-draft-n-max
    - "6"
    - --spec-draft-p-min
    - "0.60"
    - --cache-prompt
    - --kv-unified
    # Qwen3.8 thinking-mode sampler (thinking is on by default).
    - --temp
    - "1.0"
    - --top-p
    - "0.95"
    - --top-k
    - "20"
    - --min-p
    - "0"
    - --presence-penalty
    - "0"
    - --repeat-penalty
    - "1.0"
    - --threads
    - "16"
    - --threads-batch
    - "21"
    - --load-mode
    - none
    # Default thinking depth. Qwen3.8 reportedly does best at "medium"
    # (or disabled). Clients can override per-request (see below); to
    # disable thinking entirely server-side, set reasoningBudget: 0.
    - --chat-template-kwargs
    - '{"reasoning_effort":"medium","preserve_thinking":true}'
  flashAttention: true
  image: docker.io/kyuz0/amd-strix-halo-toolboxes:rocm-6.4.4@sha256:de576ea401d5610419e4c983baee89469695a4a3c194339fa8edf35ad2d3bc66
  jinja: true
  modelCache:
    claimName: llmkube-strix-cache
  modelRef: qwen3.8-27b
  nodeSelector:
    kubernetes.io/hostname: talos-04
    topology.kubernetes.io/gpus: amd
  parallelSlots: 2
  priority: high
  probeOverrides:
    liveness:
      failureThreshold: 6
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 30
    readiness:
      failureThreshold: 6
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 20
      periodSeconds: 10
    startup:
      failureThreshold: 360
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
  reasoningBudget: 16384
  reasoningBudgetMessage: "Stop reasoning and produce the implementation, tool call, or final answer."
  replicas: 1
  # Dense 27B @ Q6 (~22GB weights) + 131072 q8 KV + mmproj. Tune to your
  # actual GPU budget — and see the coexistence note if this runs
  # alongside the 35B on talos-04.
  resources:
    cpu: "500m"
    memory: 40Gi
  rolloutPolicy:
    idleTimeoutSeconds: 86400
    waitForIdle: true
  runtime: llamacpp
  tolerations:
    - effect: NoSchedule
      key: llm-workload
      operator: Exists
  uBatchSize: 2048

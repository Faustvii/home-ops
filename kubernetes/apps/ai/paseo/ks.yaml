---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app paseo
  namespace: &namespace ai
spec:
  components:
    - ../../../../components/kopiur
  dependsOn:
    - name: kopiur
      namespace: storage
  interval: 1h
  path: ./kubernetes/apps/ai/paseo/app
  postBuild:
    substitute:
      APP: *app
      KOPIUR_CAPACITY: 15Gi
      NAMESPACE: *namespace
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace

---

categories_as_tabs:
  general:
  images:
  map:
  videos:

enabled_plugins:
  - Basic Calculator
  - Hash plugin
  - Open Access DOI rewrite
  - Self Informations
  - Tracker URL remover
  - Unit converter plugin

general:
  instance_name: Faust Search

hostnames:
  high_priority:
    - (.*)\/blog\/(.*)
    - (.*\.)?wikipedia.org$
    - (.*\.)?github.com$
    - (.*\.)?reddit.com$
    - (.*\.)?docker.com$
    - (.*\.)?archlinux.org$
    - (.*\.)?stackoverflow.com$
    - (.*\.)?askubuntu.com$
    - (.*\.)?superuser.com$

search:
  autocomplete: duckduckgo
  favicon_resolver: duckduckgo
  formats:
    - html
    - json
  languages:
    - all
    - en
    - en-US

server:
  image_proxy: true
  limiter: true
  method: GET # https://github.com/searxng/searxng/pull/3619
  public_instance: false

ui:
  default_theme: simple
  infinite_scroll: true
  query_in_title: true
  results_on_new_tab: true
  static_use_hash: true
  theme_args:
    simple_style: auto
use_default_settings: true

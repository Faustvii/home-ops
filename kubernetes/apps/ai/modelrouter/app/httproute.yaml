---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: modelrouter
  annotations:
    gatus.home-operations.com/enabled: "false"
spec:
  hostnames:
    - modelrouter.${SECRET_DOMAIN}
  parentRefs:
    - name: envoy-internal
      namespace: network
  rules:
    - backendRefs:
        # ClusterIP Service provisioned by the ModelRouter controller.
        - name: modelrouter-router-proxy
          port: 8080

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: modelrouter-apikey
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: modelrouter-apikey
    template:
      # apiKeyAuth Secret shape: data key = client id, value = raw key.
      data:
        home-ops: "{{ .API_KEY }}"
  dataFrom:
    - find:
        path: /modelrouter

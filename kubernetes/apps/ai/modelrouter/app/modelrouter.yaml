---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/modelrouter_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: ModelRouter
metadata:
  name: modelrouter
spec:
  # Managed router-proxy mode (default). The controller provisions a
  # Deployment + ClusterIP Service named "modelrouter-router-proxy" on
  # :8080 exposing /v1/chat/completions and /v1/models. No inbound auth
  # is enforced here — that is handled at the edge (SecurityPolicy) and
  # east-west (CiliumNetworkPolicy).
  backends:
    # displayName == the model id published on /v1/models and what
    # BackendNameMatch resolves the request's "model" field against.
    # name stays k8s-safe (^[a-z0-9][a-z0-9-]{0,62}$, no dots).
    #
    # Qwen3.8-Flash-Next on gufo — the only model on the Strix box.
    - name: self-qwen3-8-flash-next
      displayName: self-qwen3.8-flash-next
      tier: local
      inferenceServiceRef:
        name: qwen3.8-flash-next-strix
      timeout: 20m
      capabilities:
        - code
        - tools
        - vision
  # BackendNameMatch: the request's "model" selects the backend by
  # displayName; anything unmatched falls through to defaultRoute.
  defaultRouteStrategy: BackendNameMatch
  # defaultRoute references the k8s-safe name, not the displayName.
  defaultRoute: self-qwen3-8-flash-next
  proxy:
    # TWO independent timeouts gate a dispatch, and BOTH must be raised:
    #   - backends[].timeout (20m, set on self-qwen3-8-flash-next) = overall dispatch
    #     deadline. Proven applied: successful tool calls log timeoutMs=1200000.
    #   - responseHeaderTimeout below = the Go http.Transport
    #     ResponseHeaderTimeout, a SEPARATE lower cap on "time to first
    #     response header". For a non-streamed request headers arrive only
    #     when generation finishes, so at ~7.6 tok/s any verdict >~900 tokens
    #     crosses the 120s DEFAULT and 502s with "timeout awaiting response
    #     headers" BEFORE the 20m dispatch deadline is ever reached.
    responseHeaderTimeout: 20m
    quarantineDuration: 1s
  policy:
    auditLog:
      sink: stdout

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app omniroute
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
    controllers:
      *app :
        containers:
          app:
            image:
              repository: ghcr.io/diegosouzapw/omniroute
              tag: 3.8.49@sha256:92c768c56e2de32c51a0621ef182835018b00b288c9bb235c5c5e4514658c1a1
            env:
              NODE_ENV: production
              PORT: &port 20128
              REDIS_URL: "redis://dragonfly.database.svc.cluster.local:6379/3"
              TZ: "${TZ}"
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  failureThreshold: 3
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  tcpSocket:
                    port: *port
                  timeoutSeconds: 10
              readiness: *probe
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true

    persistence:
      data:
        existingClaim: *app
        globalMounts:
          - path: /app/data
            subPath: data

    route:
      main:
        hostnames: ["{{ .Release.Name }}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 80

    service:
      app:
        controller: *app
        ports:
          http:
            port: 80
            targetPort: *port

      # tmpfs:
      #   type: emptyDir
      #   globalMounts:
      #     - path: /tmp
      #       subPath: tmp

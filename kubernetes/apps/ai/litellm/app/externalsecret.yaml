---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: litellm
    template:
      data:
        LITELLM_MASTER_KEY: "{{ .MASTER_KEY }}"
  dataFrom:
    - find:
        path: /litellm

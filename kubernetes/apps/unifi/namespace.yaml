---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/v1.35.0/namespace-v1.json
apiVersion: v1
kind: Namespace
metadata:
  name: unifi
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    # UniFi OS Server runs systemd and needs a privileged container
    pod-security.kubernetes.io/enforce: privileged

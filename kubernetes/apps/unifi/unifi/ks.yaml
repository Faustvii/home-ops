---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app unifi
  namespace: &namespace unifi
spec:
  components:
    - ../../../../components/kopiur
  dependsOn:
    - name: kopiur
      namespace: storage
  interval: 1h
  path: ./kubernetes/apps/unifi/unifi/app
  postBuild:
    substitute:
      APP: *app
      KOPIUR_CAPACITY: 10Gi
      # UniFi OS runs mongodb, postgres and rabbitmq as their own users; the
      # mover must be root to read and restore those files with their owners.
      KOPIUR_PGID: "0"
      KOPIUR_PUID: "0"
      NAMESPACE: *namespace
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cert-manager.io/issuer_v1.json
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: unifi-selfsigned
spec:
  selfSigned: {}
---
# The certificate UniFi OS serves on 443. It is mounted over
# /data/unifi-core/config/unifi-core.{crt,key}, and the BackendTLSPolicy trusts
# it (it is its own CA). Long-lived so a renewal does not restart the pod often.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cert-manager.io/certificate_v1.json
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: unifi
spec:
  commonName: unifi.${SECRET_DOMAIN}
  dnsNames:
    - unifi.${SECRET_DOMAIN}
    - unifi.local
    - localhost
  duration: 43800h
  isCA: true
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: unifi-selfsigned
  privateKey:
    algorithm: RSA
    rotationPolicy: Always
    size: 2048
  renewBefore: 720h
  secretName: unifi-tls
  usages:
    - digital signature
    - key encipherment
    - server auth
    - cert sign

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app unifi
spec:
  chartRef:
    kind: OCIRepository
    name: unifi
  interval: 1h
  values:
    configMaps:
      timedatectl:
        data:
          timedatectl: |
            #!/bin/sh
            # UniFi OS refuses the Ubiquiti sign-in unless timedatectl reports
            # NTP=yes and NTPSynchronized=yes. A container has no timesyncd
            # (NTP always reads "no"), but it shares the host clock, which
            # Talos keeps in sync. Report the service as on and keep the real
            # NTPSynchronized value.
            case "$*" in
              *--property=NTP*)
                for arg in "$@"; do
                  case "$arg" in
                    --property=NTPSynchronized) /usr/bin/timedatectl show --value --property=NTPSynchronized ;;
                    --property=NTP) echo yes ;;
                  esac
                done
                ;;
              *) exec /usr/bin/timedatectl "$@" ;;
            esac
    controllers:
      *app :
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/lemker/unifi-os-server
              tag: v1.8.0@sha256:c0136d42d238b9574d93676aada3f61971ffb6bcbe2a3050627a9fa7ced7c878
            env:
              HOST_IP:
                valueFrom:
                  fieldRef:
                    fieldPath: status.hostIP
              # The address devices use for set-inform (the LoadBalancer IP)
              UOS_SYSTEM_IP: 192.168.10.62
            lifecycle:
              postStart:
                exec:
                  command: ["/bin/bash", "-c", "echo $HOST_IP host.docker.internal >> /etc/hosts"]
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  failureThreshold: 3
                  httpGet:
                    path: /api/ping
                    port: 80
                  initialDelaySeconds: 10
                  periodSeconds: 60
                  timeoutSeconds: 5
              startup:
                enabled: true
                custom: true
                spec:
                  failureThreshold: 60
                  periodSeconds: 10
                  tcpSocket:
                    port: 443
            resources:
              requests:
                cpu: 200m
                memory: 1Gi
              limits:
                memory: 4Gi
            # Not privileged. systemd needs a writable cgroup, so the command
            # remounts /sys/fs/cgroup (needs SYS_ADMIN) before the entrypoint
            # (the upstream compose file uses cgroup: host instead).
            command:
              - /bin/bash
              - -c
              - mount -o remount,rw /sys/fs/cgroup; exec /root/uos-entrypoint.sh
            # allowPrivilegeEscalation must stay true: UniFi OS runs
            # `sudo ubnt-tools id` as a service user, and no_new_privs breaks
            # sudo ("effective uid is not 0"), which leaves ulp-go without
            # device info and the setup wizard with an error.
            securityContext:
              allowPrivilegeEscalation: true
              capabilities:
                add: ["NET_ADMIN", "NET_RAW", "SYS_ADMIN"]
    persistence:
      timedatectl:
        type: configMap
        identifier: timedatectl
        defaultMode: 0755
        advancedMounts:
          *app :
            app:
              - path: /usr/local/bin/timedatectl
                subPath: timedatectl
                readOnly: true
      tls:
        type: secret
        name: unifi-tls
        defaultMode: 0600
        advancedMounts:
          *app :
            app:
              - path: /data/unifi-core/config/unifi-core.crt
                subPath: tls.crt
                readOnly: true
              - path: /data/unifi-core/config/unifi-core.key
                subPath: tls.key
                readOnly: true
      config:
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          *app :
            app:
              - path: /persistent
                subPath: persistent
              - path: /var/log
                subPath: log
              - path: /data
                subPath: data
              - path: /srv
                subPath: srv
              - path: /var/lib/unifi
                subPath: unifi
              - path: /var/lib/mongodb
                subPath: mongodb
              - path: /etc/rabbitmq/ssl
                subPath: rabbitmq
      run:
        type: emptyDir
        medium: Memory
        advancedMounts:
          *app :
            app:
              - path: /run
      run-lock:
        type: emptyDir
        medium: Memory
        advancedMounts:
          *app :
            app:
              - path: /run/lock
      tmp:
        type: emptyDir
        medium: Memory
        advancedMounts:
          *app :
            app:
              - path: /tmp
      journal:
        type: emptyDir
        medium: Memory
        advancedMounts:
          *app :
            app:
              - path: /var/lib/journal
      unifi-tmp:
        type: emptyDir
        medium: Memory
        sizeLimit: 64Mi
        advancedMounts:
          *app :
            app:
              - path: /var/opt/unifi/tmp
    service:
      app:
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: 192.168.10.62
        externalTrafficPolicy: Cluster
        ports:
          https:
            port: 11443
            targetPort: 443
          inform:
            port: 8080
          stun:
            port: 3478
            protocol: UDP
          discovery:
            port: 10003
            protocol: UDP
          rtp:
            port: 5005
          id-hub:
            port: 9543
          speedtest:
            port: 6789
          hotspot-secure:
            port: 8444
          syslog:
            port: 5514
            protocol: UDP
          aqmps:
            port: 5671
          hotspot-redirect-0:
            port: 8880
          hotspot-redirect-1:
            port: 8881
          hotspot-redirect-2:
            port: 8882

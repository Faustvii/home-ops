---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./backendtlspolicy.yaml
  - ./certificate.yaml
  - ./helmrelease.yaml
  - ./httproute.yaml
  - ./ocirepository.yaml
# Root alone cannot read the owner-only files of mongodb, postgres and
# rabbitmq: the kopiur mover drops every capability. Give it the file-access
# ones for the snapshots and the restores. (Kustomization spec.patches in
# ks.yaml do not work here, the parent Kustomization overwrites them.)
patches:
  - patch: |-
      - op: add
        path: /spec/mover/securityContext/capabilities
        value:
          add: ["CHOWN", "DAC_OVERRIDE", "DAC_READ_SEARCH", "FOWNER"]
    target:
      group: kopiur.home-operations.com
      kind: SnapshotPolicy
      name: unifi
  - patch: |-
      - op: add
        path: /spec/mover/securityContext/capabilities
        value:
          add: ["CHOWN", "DAC_OVERRIDE", "DAC_READ_SEARCH", "FOWNER"]
    target:
      group: kopiur.home-operations.com
      kind: Restore
      name: unifi

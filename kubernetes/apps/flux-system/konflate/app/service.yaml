---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/v1/service.json
# A fixed address for kritika's runners: its egress gateway reaches a private
# address only when an allow entry covers it, and the chart's Service can't
# pin one.
apiVersion: v1
kind: Service
metadata:
  name: konflate-kritika
spec:
  clusterIP: 10.43.0.80
  selector:
    app.kubernetes.io/instance: konflate
    app.kubernetes.io/name: konflate
  ports:
    - name: http
      port: 8080
      targetPort: http

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: konflate
spec:
  chartRef:
    kind: OCIRepository
    name: konflate
  interval: 1h
  values:
    config:
      mcp: true
      prCommentTemplate: |
        ## konflate · #{{ .PR.Number }} — {{ .PR.Title }}

        {{ .Summary }}
      prComments: true
      repo: github://faustvii/home-ops
      statusChecks: true
    httpRoute:
      annotations:
        gatus.home-operations.com/endpoint: |-
          conditions: ["[STATUS] == 200"]
      enabled: true
      hostnames:
        - "{{ .Release.Name }}.${SECRET_DOMAIN}"
      parentRefs:
        - name: envoy-external
          namespace: network
    monitoring:
      serviceMonitor:
        enabled: true
    resources:
      limits:
        memory: 2Gi
      requests:
        cpu: 50m
    secret:
      existingSecret: konflate-webhook-token-secret

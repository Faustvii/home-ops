---
# yaml-language-server: $schema=https://raw.githubusercontent.com/aclerici38/pocket-id-operator/main/dist/schemas/pocketidoidcclient_v1alpha1.json
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: homepage
spec:
  allowedUserGroups:
    - name: homepage-users
  callbackUrls:
    - https://home.${SECRET_DOMAIN_1}/oauth2/callback
  launchUrl: https://home.${SECRET_DOMAIN_1}
  logoutCallbackUrls:
    - https://home.${SECRET_DOMAIN_1}/
  name: Homepage
  pkceEnabled: false
  secret:
    keys:
      clientID: client-id
      clientSecret: client-secret
    name: homepage-oidc-credentials

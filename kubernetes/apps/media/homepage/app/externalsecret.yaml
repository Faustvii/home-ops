---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homepage
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: homepage
  # every /arr key becomes HOMEPAGE_VAR_<KEY> (see envFrom prefix), usable as
  # {{HOMEPAGE_VAR_<KEY>}} in the private services.yaml on the config volume
  dataFrom:
    - find:
        path: /arr

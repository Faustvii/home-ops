---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app shelfglade
  namespace: &namespace media
spec:
  components:
    - ../../../../components/database/postgres/standalone
  dependsOn:
    - name: pocket-id
      namespace: security
    - name: nfs-pvcs
      namespace: *namespace
  interval: 1h
  path: ./kubernetes/apps/media/shelfglade/app
  postBuild:
    substitute:
      APP: *app
      DATABASE_DB_PATH: ./kubernetes/apps/media/shelfglade/db
      NAMESPACE: *namespace
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace

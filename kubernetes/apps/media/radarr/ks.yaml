---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app radarr
  namespace: &namespace media
spec:
  interval: 1h
  components:
    - ../../../../components/kopiur
    - ../../../../components/dashbrr
  dependsOn:
    - name: pocket-id
      namespace: security
  path: ./kubernetes/apps/media/radarr/app
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
      OIDC_APP_NAME: Radarr
      OIDC_CALLBACK_PATH: /oauth2/callback
      OIDC_LOGOUT_CALLBACK_PATH: /
      OIDC_PROVIDER_LOGOUT_PATH: /logout
      KOPIUR_CAPACITY: 10Gi
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  wait: false

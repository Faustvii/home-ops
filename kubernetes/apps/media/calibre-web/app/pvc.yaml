---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: calibre-web
spec:
  accessModes:
    - ReadWriteOnce
  dataSourceRef:
    apiGroup: volsync.backube
    kind: ReplicationDestination
    name: calibre-web-dst
  resources:
    requests:
      storage: 2Gi
  storageClassName: miroir-replicated

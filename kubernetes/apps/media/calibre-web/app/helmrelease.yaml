---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app calibre-web
spec:
  chartRef:
    kind: OCIRepository
    name: calibre-web
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
    controllers:
      *app :
        containers:
          app:
            image:
              repository: oci.trueforge.org/containerforge/calibre-web
              tag: 0.6.27@sha256:de470a91dd0bbef215fdc43ddf746d671a259e245944347fc62672ce41f8e023
            env:
              TZ: UTC
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  failureThreshold: 3
                  periodSeconds: 10
                  tcpSocket:
                    port: &port 8083
                  timeoutSeconds: 1
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
                  tcpSocket:
                    port: *port
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true
    persistence:
      books:
        existingClaim: media-books-nfs-pvc
        globalMounts:
          - path: /media/books
      cache:
        type: emptyDir
        globalMounts:
          - path: /app/calibre-web/cps/cache
      config:
        existingClaim: "{{ .Release.Name }}"
      tmp:
        type: emptyDir
    route:
      app:
        hostnames:
          - books.${SECRET_DOMAIN_1}
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          # calibre-web logs in from this header (reverse proxy login). Only the pocket-id
          # group calibre-web-users (faust) passes OIDC, so every request is firefaust.
          - backendRefs:
              - identifier: app
                port: *port
            filters:
              - requestHeaderModifier:
                  set:
                    - name: X-authentik-username
                      value: firefaust
                type: RequestHeaderModifier
    service:
      app:
        ports:
          http:
            port: *port

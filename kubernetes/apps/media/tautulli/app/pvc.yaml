---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tautulli
spec:
  accessModes:
    - ReadWriteOnce
  dataSourceRef:
    apiGroup: volsync.backube
    kind: ReplicationDestination
    name: tautulli-dst
  resources:
    requests:
      storage: 5Gi
  storageClassName: miroir-replicated

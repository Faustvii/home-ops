---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bookarr
spec:
  chartRef:
    kind: OCIRepository
    name: bookarr
  interval: 1h
  values:
    defaultPodOptions:
      annotations:
        instrumentation.opentelemetry.io/inject-sdk: observability/instrumentation
      imagePullSecrets:
        - name: docker-registry-ghcr
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
    controllers:
      bookarr:
        annotations:
          reloader.stakater.com/auto: "true"
        rollingUpdate:
          maxSurge: 1
          maxUnavailable: 1
        strategy: RollingUpdate
        containers:
          app:
            image:
              repository: ghcr.io/faustvii/bookarr
              tag: 1.1.0@sha256:81dead6e9345f5d1240c169d3b0811295cc514a48879235068e3e22e0f5330b6
            env:
              CACHE__CACHEPATH: /cache/bookarrCache.db
              MetadataProviders__HardcoverRreadingGlassesApi__Url: https://rghc.${SECRET_DOMAIN}
              MetadataProviders__GoodreadsRreadingGlassesApi__Url: https://rggr.${SECRET_DOMAIN}
              CONNECTIONSTRINGS__BOOKARRDB:
                valueFrom:
                  secretKeyRef:
                    key: connectionString
                    name: bookarr-postgres
              DATABASE__USEPOSTGRES: "true"
              TZ: ${TZ}
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  failureThreshold: 3
                  httpGet:
                    path: /alive
                    port: &port 8080
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
              readiness: *probes
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true
    persistence:
      config:
        type: emptyDir
      cache:
        type: emptyDir
      library:
        type: emptyDir
        globalMounts:
          - path: /app/import
            subPath: import
          - path: /app/failed
            subPath: failed
          - path: /app/duplicate
            subPath: duplicate
          - path: /app/done
            subPath: done
          - path: /tmp
            subPath: tmp

      #   existingClaim: "{{ .Release.Name }}"
      books:
        existingClaim: media-books-nfs-pvc
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-external
            namespace: network
    service:
      app:
        ports:
          http:
            port: *port

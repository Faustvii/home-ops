---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app bookarr
  namespace: &namespace media
spec:
  components:
    - ../../../../components/database/postgres
  interval: 1h
  path: ./kubernetes/apps/media/bookarr/app

  postBuild:
    substitute:
      APP: *app
      KOPIUR_CAPACITY: 2Gi
      OIDC_APP_NAME: Bookarr
      OIDC_LOGOUT_CALLBACK_PATH: /login
      OIDC_PROVIDER_LOGOUT_PATH: /logout
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace

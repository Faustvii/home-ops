---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: bookarr
spec:
  interval: 1h
  path: ./kubernetes/apps/media/bookarr/app
  components:
    - ../../../../components/database/postgres

  postBuild:
    substitute:
      APP: bookarr
      KOPIUR_CAPACITY: 2Gi
      OIDC_APP_NAME: Bookarr
      OIDC_CALLBACK_PATH: /oauth2-callback
      OIDC_LOGOUT_CALLBACK_PATH: /login
      OIDC_PROVIDER_LOGOUT_PATH: /logout
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: media
  wait: false

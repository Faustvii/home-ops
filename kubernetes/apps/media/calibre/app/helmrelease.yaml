---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app calibre
spec:
  chartRef:
    kind: OCIRepository
    name: calibre
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      *app :
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/linuxserver/calibre
              tag: 9.17.0@sha256:b198fc03a6abc6be7e251a9958e50e74634b00e447c7b25e92c191c8077ba378
            env:
              PGID: "1000"
              PUID: "1000"
              TZ: ${TZ}
              UMASK: "0022"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  failureThreshold: 5
                  periodSeconds: 30
                  tcpSocket:
                    port: &port 8080
                  timeoutSeconds: 5
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
                  tcpSocket:
                    port: *port
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
                drop: ["ALL"]
              runAsGroup: 0
              runAsNonRoot: false
              runAsUser: 0
              seccompProfile:
                type: RuntimeDefault
    persistence:
      books:
        existingClaim: media-books-nfs-pvc
        globalMounts:
          - path: /media/books
      config:
        existingClaim: "{{ .Release.Name }}"
      shm:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Gi
        globalMounts:
          - path: /dev/shm
    service:
      app:
        ports:
          http:
            port: *port
          webserver:
            port: 8081

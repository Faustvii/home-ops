---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: plexanilistsync
spec:
  accessModes:
    - ReadWriteOnce
  dataSourceRef:
    apiGroup: volsync.backube
    kind: ReplicationDestination
    name: plexanilistsync-dst
  resources:
    requests:
      storage: 1Gi
  storageClassName: miroir-replicated

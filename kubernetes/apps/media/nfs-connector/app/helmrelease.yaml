---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nfs-connector
spec:
  chartRef:
    kind: OCIRepository
    name: nfs-connector
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
    controllers:
      nfs-connector:
        type: daemonset
        containers:
          app:
            image:
              repository: alpine
              tag: "3.24"
            command: ["sleep", "infinity"]
            resources:
              requests:
                cpu: 1m
                memory: 8Mi
              limits:
                memory: 16Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true
    persistence:
      media:
        existingClaim: plex-media-nfs-pvc

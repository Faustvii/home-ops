---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: plex
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: plex
      app.kubernetes.io/name: plex
  ingress:
    # Direct playback through the Plex LoadBalancer (192.168.10.60).
    - fromCIDR:
        - 192.168.10.0/24
      toPorts:
        - ports:
            - port: "32400"
              protocol: TCP
    # HTTPS clients and monitoring reach Plex through envoy-external.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: network
            app.kubernetes.io/name: envoy
            gateway.envoyproxy.io/owning-gateway-name: envoy-external
      toPorts:
        - ports:
            - port: "32400"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: media
          matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values:
                - homepage
                - ombi
                - seerr
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: media-management
          matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values:
                - maintainerr
                - plexanilistsync
                - radarr
                - sonarr
                - sonarr-anime
                - tautulli
      toPorts:
        - ports:
            - port: "32400"
              protocol: TCP
    # Kubelet health checks originate on the node hosting Plex.
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "32400"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          # The DNS proxy learns the addresses used by the FQDN rules below.
          rules:
            dns:
              - matchPattern: "*"
    # Account services, notifications, metadata, artwork, and codecs.
    - toFQDNs:
        - matchName: plex.tv
        - matchName: servers.plex.tv
        - matchName: scrobbles.plex.tv
        - matchName: notifications.plex.tv
        - matchName: pubsub.plex.tv
        - matchPattern: "pubsub*.pop.*.plex.bz"
        - matchName: metadata-static.plex.tv
        - matchName: metadata.provider.plex.tv
        - matchName: images.plex.tv
        - matchName: downloads.plex.tv
        - matchName: me.plexapp.com
        - matchName: resources-cdn.plexapp.com
        - matchName: image.tmdb.org
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # The bundled agent framework still fetches resources over HTTP.
    - toFQDNs:
        - matchName: resources-cdn.plexapp.com
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP

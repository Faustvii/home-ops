---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app unpackerr
spec:
  chartRef:
    kind: OCIRepository
    name: unpackerr
  interval: 1h
  values:
    defaultPodOptions:
      nodeSelector:
        kubernetes.io/hostname: talos-03
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      tolerations:
        - effect: NoSchedule
          key: dedicated
          operator: Equal
          value: talos-03
    controllers:
      *app :
        containers:
          app:
            image:
              repository: ghcr.io/unpackerr/unpackerr
              tag: 0.15.2@sha256:89e13608521ece21dd300c39229fd595a55fbf4b8152771af5670a7455b5c747
            env:
              TZ: UTC
              UN_DIR_MODE: "0755"
              UN_FILE_MODE: "0644"
              UN_INTERVAL: 1m
              UN_LOG_QUEUES: 1m
              UN_PARALLEL: "1"
              UN_RETRY_DELAY: 5m
              UN_START_DELAY: 1m
              # arrs: http://<service>.media-management.svc.cluster.local, port 80
              UN_RADARR_0_DELETE_ORIG: "false"
              UN_RADARR_0_PATHS_0: /downloads
              UN_RADARR_0_PROTOCOLS: torrent
              UN_RADARR_0_TIMEOUT: 10s
              UN_RADARR_0_URL: http://radarr.media-management.svc.cluster.local
              UN_SONARR_0_DELETE_ORIG: "false"
              UN_SONARR_0_PATHS_0: /downloads
              UN_SONARR_0_PROTOCOLS: torrent
              UN_SONARR_0_TIMEOUT: 10s
              UN_SONARR_0_URL: http://sonarr.media-management.svc.cluster.local
              UN_SONARR_1_DELETE_ORIG: "false"
              UN_SONARR_1_PATHS_0: /downloads
              UN_SONARR_1_PROTOCOLS: torrent
              UN_SONARR_1_TIMEOUT: 10s
              UN_SONARR_1_URL: http://sonarr-anime.media-management.svc.cluster.local
            envFrom:
              - secretRef:
                  name: *app
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true
    persistence:
      downloads:
        existingClaim: downloads-nfs-pvc
        globalMounts:
          - path: /downloads
      tmp:
        type: emptyDir

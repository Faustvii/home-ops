---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qui
spec:
  chartRef:
    kind: OCIRepository
    name: qui
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
    controllers:
      qui:
        pod:
          labels:
            egress.netpol.home.arpa/envoy-external: allow
            egress.netpol.home.arpa/envoy-internal: allow
            egress.netpol.home.arpa/internet-https: allow
            egress.netpol.home.arpa/qbittorrent: allow
            egress.netpol.home.arpa/qbooks: allow
            ingress.netpol.home.arpa/envoy-internal: allow
            ingress.netpol.home.arpa/host: allow
            ingress.netpol.home.arpa/observability: allow
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/autobrr/qui
              tag: v1.37.0@sha256:73e662791712a01dd1f7565b21792a406e3478f7257937e9e0bb110614cc4075
            env:
              QUI__DISABLE_SELF_UPDATE: "true"
              QUI__HOST: 0.0.0.0
              QUI__LOG_LEVEL: INFO
              QUI__METRICS_ENABLED: "true"
              QUI__METRICS_HOST: "0.0.0.0"
              QUI__METRICS_PORT: &metrics_port 9000
              QUI__OIDC_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: qui-oidc-credentials
                    key: client-id
              QUI__OIDC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: qui-oidc-credentials
                    key: client-secret
              QUI__OIDC_DISABLE_BUILT_IN_LOGIN: "true"
              QUI__OIDC_ENABLED: "true"
              QUI__OIDC_ISSUER: https://idm.${SECRET_DOMAIN}
              QUI__OIDC_REDIRECT_URL: https://qui.${SECRET_DOMAIN}/api/auth/oidc/callback
              QUI__PORT: &port 80
              QUI__TRACKER_ICONS_FETCH_ENABLED: false
              TZ: America/New_York
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  failureThreshold: 3
                  httpGet:
                    path: /health
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
              readiness: *probes
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true
    persistence:
      config:
        # type: emptyDir
        existingClaim: "{{ .Release.Name }}"
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
    service:
      app:
        ports:
          http:
            port: *port
          metrics:
            port: *metrics_port
    serviceMonitor:
      app:
        endpoints:
          - port: metrics
      # media:
      #   type: nfs
      #   server: isos.${SECRET_DOMAIN}
      #   path: /mnt/linux/isos
      #   globalMounts:
      #     - path: /media/isos
      #       subPath: isos

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app mam-ip-sync
spec:
  chartRef:
    kind: OCIRepository
    name: mam-ip-sync
  interval: 1h
  values:
    defaultPodOptions:
      restartPolicy: Never
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
    controllers:
      *app :
        type: cronjob
        cronjob:
          backoffLimit: 1
          concurrencyPolicy: Forbid
          failedJobsHistory: 1
          schedule: "*/5 * * * *"
          successfulJobsHistory: 1
          ttlSecondsAfterFinished: 3600
        containers:
          app:
            image:
              repository: docker.io/curlimages/curl
              tag: 8.23.0@sha256:11e64e28c5f58c8d93ee95fcf22ac055f48b0bc440e0ce7d8013bbb5ad6aa8ac
            command: ["/bin/sh", "/scripts/sync.sh"]
            env:
              PROXY: http://vpn-proxy.media-management.svc.cluster.local:8888
            envFrom:
              - secretRef:
                  name: *app
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true
    persistence:
      data:
        existingClaim: *app
        globalMounts:
          - path: /data
      script:
        type: configMap
        name: mam-ip-sync-script
        defaultMode: 0555
        globalMounts:
          - path: /scripts

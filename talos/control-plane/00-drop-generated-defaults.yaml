apiVersion: v1alpha1
kind: KubeNodeConfig
labels:
  # Talos adds this to control-plane nodes by default; drop it so they stay
  # eligible as external load-balancer targets.
  node.kubernetes.io/exclude-from-external-load-balancers:
    $patch: delete
taints:
  # Equivalent of cluster.allowSchedulingOnControlPlanes: true
  node-role.kubernetes.io/control-plane:
    $patch: delete

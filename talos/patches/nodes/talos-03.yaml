# yaml-language-server: $schema=https://raw.githubusercontent.com/siderolabs/talos/v1.13.0/pkg/machinery/config/schemas/config.schema.json
# Node-specific machine config for talos-03 (control plane, VM node).
# Migrated out of the former talhelper talconfig.yaml top-level node fields
# (installDisk / kernelModules / networkInterfaces / nodeTaints).
machine:
  install:
    disk: /dev/vda
  kernel:
    modules:
      - name: dm_thin_pool
      - name: drbd
        parameters:
          - usermode_helper=disabled
      - name: drbd_transport_tcp
      - name: nbd
  network:
    interfaces:
      - interface: bond0
        bond:
          deviceSelectors:
            - hardwareAddr: "00:a0:98:05:d4:96"
          mode: active-backup
        dhcp: false
        addresses:
          - "192.168.10.12/24"
        routes:
          - network: "0.0.0.0/0"
            gateway: "192.168.10.1"
        mtu: 1500
        vip:
          ip: "192.168.10.20"
        vlans:
          - vlanId: 90
            dhcp: false

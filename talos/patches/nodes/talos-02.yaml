# yaml-language-server: $schema=https://raw.githubusercontent.com/siderolabs/talos/v1.13.0/pkg/machinery/config/schemas/config.schema.json
# Node-specific machine config for talos-02 (control plane).
# Migrated out of the former talhelper talconfig.yaml top-level node fields
# (installDiskSelector / kernelModules / networkInterfaces / nodeLabels).
machine:
  nodeLabels:
    topology.kubernetes.io/gpus: amd
  install:
    diskSelector:
      serial: "S436NA0NA18451"
  kernel:
    modules:
      - name: zfs
      - name: amdgpu
        parameters:
          - ppfeaturemask=0xffffffff
      - name: dm_thin_pool
      - name: drbd
        parameters:
          - usermode_helper=disabled
      - name: drbd_transport_tcp
      - name: nbd
  network:
    interfaces:
      - interface: bond0
        bond:
          deviceSelectors:
            - driver: igc
              hardwareAddr: "38:05:25:36:ab:*"
          mode: active-backup
        dhcp: false
        addresses:
          - "192.168.10.11/24"
        routes:
          - network: "0.0.0.0/0"
            gateway: "192.168.10.1"
        mtu: 1500
        vip:
          ip: "192.168.10.20"
        vlans:
          - vlanId: 90
            dhcp: false

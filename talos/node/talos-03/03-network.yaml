apiVersion: v1alpha1
kind: LinkAliasConfig
name: bond0-m0
selector:
  match: glob("00:a0:98:05:d4:96", mac(link.hardware_addr))
---
apiVersion: v1alpha1
kind: BondConfig
name: bond0
links:
  - bond0-m0
bondMode: active-backup
mtu: 1500
addresses:
  - address: 192.168.10.12/24
routes:
  - gateway: 192.168.10.1

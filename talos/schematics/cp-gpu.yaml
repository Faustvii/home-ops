customization:
  extraKernelArgs:
    - amd_iommu=on # PCI Passthrough
    - amd_pstate=active # AMD P-State Driver
    - iommu=pt # PCI Passthrough
    - pcie_aspm=off # Disable PCIe ASPM
    - talos.dashboard.disabled=1 # Disable Talos Dashboard
  systemExtensions:
    officialExtensions:
      - siderolabs/amd-ucode
      - siderolabs/amdgpu
      - siderolabs/drbd
      - siderolabs/gvisor
      - siderolabs/nfsd
      - siderolabs/nut-client

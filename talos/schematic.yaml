# Shared Image Factory schematic (https://factory.talos.dev).
# Applies to nodes without a nodes/<role>/<node>.schematic.yaml override.
# Current users: talos-01, talos-02.
customization:
  extraKernelArgs:
    - pcie_aspm=off # Disable PCIe ASPM
    - talos.dashboard.disabled=1 # Disable Talos Dashboard
  systemExtensions:
    officialExtensions:
      - siderolabs/amd-ucode
      - siderolabs/amdgpu
      - siderolabs/drbd
      - siderolabs/nfsd
      - siderolabs/nut-client
      - siderolabs/zfs

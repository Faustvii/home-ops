# Base schematic for talos-01 / talos-02 (control-plane storage nodes).
# Reproduces the per-node schematic that was inlined in talconfig.yaml.
customization:
  extraKernelArgs:
    - pcie_aspm=off # Disable PCIe ASPM
    - talos.dashboard.disabled=1 # Disable Talos Dashboard
  systemExtensions:
    officialExtensions:
      - siderolabs/amd-ucode
      - siderolabs/amdgpu
      - siderolabs/drbd
      - siderolabs/nfsd
      - siderolabs/nut-client
      - siderolabs/zfs

---
# yaml-language-server: $schema=https://kritika.home-operations.com/kritika.schema.json
# SOPS files are ciphertext: noise in the index and search.
ignore: ["**/?*.sops.*"]
rules:
  # Started from onedr0p/home-ops' renovate rule. Ordered steps with an end:
  # the open-ended version had the agent read upstream source file by file.
  - id: renovate
    whenExpr: pr.headRef.startsWith("renovate/")
    rule: >-
      This is a Renovate dependency update. The question is whether the new
      version breaks what this repository sets for the package; answer it in
      this order and submit once you can. First, read the release notes for
      each version between the old and the new with gh, or the changelog when
      there are none; the pull request body often already includes them. Open
      the compare view or a source file only to settle one specific question
      the notes leave open, such as whether a flag this repository passes was
      renamed or removed, never to read the whole compare. Second, read what
      this repository sets for the package: the values, args, flags and env
      in the files the diff touches. Report each breaking change, removal,
      rename or changed default that touches one of those settings. A change
      to something the repository does not set is not a finding and needs no
      further search. Renovate pinned the tag and digest: do not fetch
      registry tokens, manifests or image config.

---
# yaml-language-server: $schema=https://kritika.home-operations.com/kritika.schema.json
# SOPS files are ciphertext: noise in the index and search.
ignore: ["**/?*.sops.*"]
tools:
  # renovate: datasource=github-releases depName=Faustvii/agent-tools
  "aqua:Faustvii/agent-tools": v1.1.1
confidence:
  risk: medium
rules:
  - id: konflate
    paths: ["kubernetes/**"]
    rule: >-
      konflate renders this pull request's Flux manifests with flate
      at the head and at the merge base and diffs the result, so it
      shows what the change does to the cluster that the git diff
      hides. Before anything else, run `konflate <number>` with this
      pull request's number. It prints plain text, ready to
      read: konflate's summary (blast radius, cautions, image changes,
      render failures), a unified diff of every changed resource, and
      each CRD's schema changes as added, removed and changed paths.
      Where it cuts something for size it prints the exact command
      that fetches it. If it says the pull request is not tracked or
      still rendering, go on without it. Its output is what Flux will
      apply: use it to judge what the change really does and to catch
      a rendered change the diff or description does not explain. It
      is complete, so do not search the repository or the registry
      for rendered effects it does not list. When the summary says
      Routine, the change is only the version bump shown. Do not
      repeat its summary, which konflate already posts on the pull
      request.
  # Started from onedr0p/home-ops' renovate rule. Ordered steps with an end:
  # the open-ended version had the agent read upstream source file by file,
  # and it burned steps on base64 file contents and huge listings. The second
  # category (cluster changes whatever the repo sets) is what #1513's widened
  # Ingress RBAC needs; "not set, not a finding" alone would suppress it.
  # A file rule: 32 KiB instead of the inline rule's 2000 characters. Read
  # from the merge base, like this file.
  # The severity and submit paragraphs keep a step cap from turning open
  # questions into blocking findings.
  - id: renovate
    when: [{ name: renovate, expr: pr.headRef.startsWith("renovate/") }]
    file: .kritika/renovate.md
skills:
  scope:
    add-app:
      when: [{ expr: '!pr.headRef.startsWith("renovate/")' }]
      load: false

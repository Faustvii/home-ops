---
version: "3"

tasks:
  talos:
    desc: Bootstrap the Talos cluster
    dir: "{{.TALOS_DIR}}"
    vars:
      # Space-separated node hostnames (must match talos/nodes/<role>/<name>.yaml)
      NODES: talos-01 talos-02 talos-03 talos-04
      # Controller used for the one-time etcd bootstrap + kubeconfig fetch
      CONTROLLER_IP: 192.168.10.10
    cmds:
      # 1. Apply the rendered machine config to every node in maintenance mode.
      - for: {var: NODES, split: " ", as: NODE}
        cmd: |
          ip="$(yq 'select(.kind == "BondConfig") | .addresses[0].address' "{{.TALOS_DIR}}"/nodes/*/"{{.NODE}}".yaml | cut -d/ -f1)"
          task talos:render-config NODE="{{.NODE}}" | talosctl --nodes "$ip" apply-config --insecure --file /dev/stdin
      # 2. Generate the client talosconfig from the sops secret bundle.
      - task: talos:talosconfig
      # 3. Bootstrap etcd on a single controller (retry until it takes).
      - until talosctl --nodes {{.CONTROLLER_IP}} bootstrap; do sleep 10; done
      # 4. Fetch the kubeconfig into the repo root (retry until the API is up).
      - until talosctl --nodes {{.CONTROLLER_IP}} kubeconfig --force "{{.ROOT_DIR}}"; do sleep 10; done
    preconditions:
      - test -f "{{.ROOT_DIR}}/.sops.yaml"
      - test -f "{{.SOPS_AGE_KEY_FILE}}"
      - test -f "{{.TALOS_DIR}}/base.yaml"
      - test -f "{{.TALOS_DIR}}/talsecret.sops.yaml"
      - which talosctl sops yq minijinja-cli jq

  apps:
    desc: Bootstrap apps into the Talos cluster
    cmd: bash {{.SCRIPTS_DIR}}/bootstrap-apps.sh
    preconditions:
      - msg: Unsupported bash version, run `brew install bash` to upgrade
        sh: '{{if eq OS "darwin"}}test -f /opt/homebrew/bin/bash || test -f /usr/local/bin/bash{{end}}'
      - test -f {{.KUBECONFIG}}
      - test -f {{.ROOT_DIR}}/.sops.yaml
      - test -f {{.SCRIPTS_DIR}}/bootstrap-apps.sh
      - test -f {{.SOPS_AGE_KEY_FILE}}

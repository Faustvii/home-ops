---
version: "3"

tasks:
  talos:
    desc: Bootstrap the Talos cluster
    dir: "{{.TALOS_DIR}}"
    vars:
      # First control-plane node — used for the one-time bootstrap + kubeconfig fetch.
      BOOTSTRAP_NODE: '{{.BOOTSTRAP_NODE | default "192.168.10.10"}}'
    cmds:
      # Generate the encrypted secrets bundle once (talstomize consumes it directly,
      # auto-detecting the top-level `sops:` key). Skipped if it already exists.
      - >-
        [ -f talsecret.sops.yaml ] ||
        { talosctl gen secrets -o /tmp/talsecret.yaml &&
        sops --filename-override talos/talsecret.sops.yaml --encrypt /tmp/talsecret.yaml > talsecret.sops.yaml &&
        rm -f /tmp/talsecret.yaml; }
      # Push machine configs to nodes in maintenance mode. UPS creds injected via sops.
      - sops exec-env talenv.sops.yaml 'talstomize apply -f . -- --insecure'
      # Bootstrap etcd on the first control-plane node (talstomize has no bootstrap cmd).
      - until talosctl bootstrap --nodes {{.BOOTSTRAP_NODE}} --endpoints {{.BOOTSTRAP_NODE}}; do sleep 10; done
      - until talosctl kubeconfig --nodes {{.BOOTSTRAP_NODE}} --endpoints {{.BOOTSTRAP_NODE}} {{.ROOT_DIR}} --force; do sleep 10; done
    preconditions:
      - test -f {{.ROOT_DIR}}/.sops.yaml
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - test -f {{.TALOS_DIR}}/talstomize.yaml
      - which talstomize talosctl sops

  apps:
    desc: Bootstrap apps into the Talos cluster
    cmd: bash {{.SCRIPTS_DIR}}/bootstrap-apps.sh
    preconditions:
      - msg: Unsupported bash version, run `brew install bash` to upgrade
        sh: '{{if eq OS "darwin"}}test -f /opt/homebrew/bin/bash || test -f /usr/local/bin/bash{{end}}'
      - test -f {{.KUBECONFIG}}
      - test -f {{.ROOT_DIR}}/.sops.yaml
      - test -f {{.SCRIPTS_DIR}}/bootstrap-apps.sh
      - test -f {{.SOPS_AGE_KEY_FILE}}

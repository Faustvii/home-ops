---
version: "3"

tasks:
  talos:
    desc: Bootstrap the Talos cluster
    dir: "{{.TALOS_DIR}}"
    cmds:
      # Generate + sops-encrypt a secrets bundle only if one does not already exist.
      - "[ -f secrets.sops.yaml ] || topf --topfconfig topf.yaml secrets --confirm=false | sops --filename-override talos/secrets.sops.yaml --encrypt /dev/stdin > secrets.sops.yaml"
      - topf --topfconfig topf.yaml talosconfig > {{.TALOSCONFIG}}
      # apply auto-detects maintenance-mode nodes and bootstraps etcd (retries ~10m).
      - topf --topfconfig topf.yaml apply --auto-bootstrap --confirm=false
      - until topf --topfconfig topf.yaml kubeconfig --validity 24h > {{.KUBECONFIG}}; do sleep 10; done
    preconditions:
      - test -f {{.ROOT_DIR}}/.sops.yaml
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - test -f {{.TALOS_DIR}}/topf.yaml
      - which topf talosctl sops

  apps:
    desc: Bootstrap apps into the Talos cluster
    cmd: bash {{.SCRIPTS_DIR}}/bootstrap-apps.sh
    preconditions:
      - msg: Unsupported bash version, run `brew install bash` to upgrade
        sh: '{{if eq OS "darwin"}}test -f /opt/homebrew/bin/bash || test -f /usr/local/bin/bash{{end}}'
      - test -f {{.KUBECONFIG}}
      - test -f {{.ROOT_DIR}}/.sops.yaml
      - test -f {{.SCRIPTS_DIR}}/bootstrap-apps.sh
      - test -f {{.SOPS_AGE_KEY_FILE}}

---
version: "3"

tasks:
  render:
    desc: Render Talos machine configs to talos/output (contains secrets, gitignored)
    dir: "{{.TALOS_DIR}}"
    cmd: topf render --output output
    preconditions:
      - test -f {{.TALOS_DIR}}/topf.yaml
      - test -f {{.ROOT_DIR}}/.sops.yaml
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - which topf vals

  diff:
    desc: Show pending config changes vs the running cluster [HOST=optional regex]
    dir: "{{.TALOS_DIR}}"
    cmd: topf apply --dry-run {{if .HOST}}--nodes-filter '{{.HOST}}'{{end}}
    preconditions:
      - talosctl config info
      - which topf talosctl vals

  apply:
    desc: Apply Talos config to the cluster [HOST=optional regex, MODE=auto]
    dir: "{{.TALOS_DIR}}"
    cmd: topf apply --mode {{.MODE}} {{if .HOST}}--nodes-filter '{{.HOST}}'{{end}}
    vars:
      MODE: '{{.MODE | default "auto"}}'
    preconditions:
      - talosctl config info
      - which topf talosctl vals

  upgrade:
    desc: Upgrade Talos on the cluster to talosVersion in topf.yaml [HOST=optional regex]
    dir: "{{.TALOS_DIR}}"
    cmd: topf upgrade --delete-if-eviction-fails {{if .HOST}}--nodes-filter '{{.HOST}}'{{end}}
    preconditions:
      - talosctl config info
      - which kubectl topf talosctl vals

  upgrade-k8s:
    desc: Upgrade Kubernetes to kubernetesVersion in topf.yaml
    dir: "{{.TALOS_DIR}}"
    cmd: talosctl upgrade-k8s --to {{.KUBERNETES_VERSION}}
    vars:
      KUBERNETES_VERSION:
        sh: yq '.kubernetesVersion' {{.TALOS_DIR}}/topf.yaml
    preconditions:
      - talosctl config info
      - which talosctl yq

  talosconfig:
    desc: Regenerate talos/talosconfig from the secrets bundle
    dir: "{{.TALOS_DIR}}"
    cmd: topf talosconfig > talosconfig
    preconditions:
      - test -f {{.TALOS_DIR}}/secrets.sops.yaml
      - which topf vals

  reset:
    desc: Reset a node back to maintenance mode [IP=required]
    dir: "{{.TALOS_DIR}}"
    prompt: This will reset {{.IP}} back to maintenance mode... continue?
    cmd: talosctl reset --nodes {{.IP}} --reboot {{- if eq .CLI_FORCE false }} --system-labels-to-wipe STATE --system-labels-to-wipe EPHEMERAL{{ end }} --graceful=false --wait=false
    requires:
      vars: [IP]
    preconditions:
      - which talosctl

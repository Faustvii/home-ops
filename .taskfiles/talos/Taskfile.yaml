---
version: "3"

# Talos config is managed with topf (https://github.com/postfinance/topf).
# Talos + Kubernetes UPGRADES are handled in-cluster by tuppr
# (kubernetes/apps/system-upgrade/tuppr) — deliberately not exposed here.
vars:
  TOPF: topf --topfconfig {{.TALOS_DIR}}/topf.yaml

tasks:
  render:
    desc: Render machine configs for all nodes to talos/clusterconfig (gitignored)
    dir: "{{.TALOS_DIR}}"
    cmd: "{{.TOPF}} render --output {{.TALOS_DIR}}/clusterconfig {{.CLI_ARGS}}"
    preconditions:
      - test -f {{.TALOS_DIR}}/topf.yaml
      - test -f {{.ROOT_DIR}}/.sops.yaml
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - which topf

  schematic-ids:
    desc: Print the resolved image-factory schematic IDs [NODE=optional]
    dir: "{{.TALOS_DIR}}"
    cmd: "{{.TOPF}} schematic-ids {{if .NODE}}--nodes-filter '^{{.NODE}}$'{{end}}"
    preconditions:
      - test -f {{.TALOS_DIR}}/topf.yaml
      - which topf

  apply-node:
    desc: Apply Talos config to a single node [NODE=hostname required, MODE=auto]
    dir: "{{.TALOS_DIR}}"
    cmd: "{{.TOPF}} apply --nodes-filter '^{{.NODE}}$' --mode {{.MODE}}"
    vars:
      MODE: '{{.MODE | default "auto"}}'
    requires:
      vars: [NODE]
    preconditions:
      - test -f {{.TALOS_DIR}}/topf.yaml
      - test -f {{.TALOSCONFIG}}
      - which topf talosctl

  talosconfig:
    desc: Generate talosconfig from the encrypted secrets bundle into $TALOSCONFIG
    dir: "{{.TALOS_DIR}}"
    cmd: "{{.TOPF}} talosconfig > {{.TALOSCONFIG}}"
    preconditions:
      - test -f {{.TALOS_DIR}}/topf.yaml
      - test -f {{.TALOS_DIR}}/secrets.sops.yaml
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - which topf

  kubeconfig:
    desc: Generate an admin kubeconfig into $KUBECONFIG (valid 24h)
    dir: "{{.TALOS_DIR}}"
    cmd: "{{.TOPF}} kubeconfig --validity 24h > {{.KUBECONFIG}}"
    preconditions:
      - test -f {{.TALOS_DIR}}/topf.yaml
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - which topf

  reset:
    desc: Resets nodes back to maintenance mode [NODE=optional]
    dir: "{{.TALOS_DIR}}"
    prompt: This will destroy your cluster and reset the nodes back to maintenance mode... continue?
    cmd: >-
      {{.TOPF}} reset --graceful=false --wait-for-maintenance
      {{- if eq .CLI_FORCE false }} --full=false{{ end }}
      {{if .NODE}} --nodes-filter '^{{.NODE}}$'{{end}}
    preconditions:
      - test -f {{.TALOS_DIR}}/topf.yaml
      - which topf
